schema = "oh.war/repository-config/v1"

[project]
name = "OpenWarrant"
namespace = "OW"

[paths]
sas = "docs/sas"
roadmap = "docs/roadmap"
adrs = "docs/adr"
warrants = "docs/warrants"

[generated]
commit = true
verify_drift = true

# §46.1's nine dimensions, for verification performed in this repository.
#
# Every value here is false, and that is not a placeholder. OpenWarrant is
# authored and verified by one actor, so there is no blind reviewer, no separate
# workspace, and no separate context compilation. §27.4 is explicit that role
# separation by one person is not organizational independence, and OW-ADR-0004
# required this to be RECORDED rather than omitted — an absent field reads as
# unexamined, `false` reads as examined and absent.
#
# `war check` therefore reports every `controlled` Warrant here as not meeting
# §46.3's minimum. That is the correct report, not a misconfiguration, and it is
# roadmap limit 4 stated where a machine can see it instead of only in prose.
[independence]
performer_transcript_blind = false
performer_rationale_blind = false
separate_writable_workspace = false
cannot_modify_subject_artifacts = false
cannot_modify_gate_definition = false
cannot_modify_gate_fixtures = false
separate_context_compilation = false
distinct_model_required = false
distinct_human_required = false

# OW-WAR-0042: the drafting agent over §75.2 — Claude Code non-interactive,
# version recorded per run under the Warrant's evidence/.
[plan]
drafter_argv = ["conformance/fixtures/drafter/claude-drafter.sh"]
drafter_name = "claude-code (conformance/fixtures/drafter/claude-drafter.sh)"
drafter_timeout_secs = 600

# The reasons this repository's signer reaches for, written once so a batch of
# acts costs a keystroke each instead of a sentence each (OW-WAR-0069). The
# tool drafts the facts; a preset adds the human's own words, verbatim.
[[sign.preset]]
key = "1"
label = "a slice of the 1.0 plan"
meaning = "The delivered bytes moved with a slice of the 1.0 plan; each commit states its own change, and this records that the artifact moved with them."
acts = ["correct"]
kind = "behaviour-change"

[[sign.preset]]
key = "2"
label = "the Apache-2.0 relicense"
meaning = "The SPDX identifier moved with the relicense to Apache-2.0 (OW-ADR-0017); the licence changed and the behaviour did not."
acts = ["correct"]
kind = "behaviour-change"

[[sign.preset]]
key = "3"
label = "a refusal was added"
meaning = "This file now refuses something it used to allow; the refusal is named in the commit that added it."
acts = ["correct"]
kind = "added-refusal"

[[sign.preset]]
key = "4"
label = "the plan authorized it"
meaning = "Authorized as a slice of the approved 1.0 plan; the contract is the one the record compiles to now."
acts = ["authorize"]

[[sign.preset]]
key = "5"
label = "obligations established, blind verification on record"
meaning = "Every declared obligation is established by a verification whose verifier is not the performer, and the thirteen are as the record reports them."
acts = ["resolve"]

# The agent that performs an agent stage (OW-WAR-0069). One at a time: nothing
# here contains a performer, so `max_concurrent` above 1 is refused.
[perform]
performer_argv = ["conformance/fixtures/performer/echo-submission.sh"]
performer_timeout_secs = 600
max_concurrent = 1
