schema = "oh.war/repository-config/v1"

[project]
name = "OpenWarrant"
namespace = "OW"

[paths]
sas = "docs/sas"
roadmap = "docs/roadmap"
adrs = "docs/adr"
warrants = "docs/warrants"

[generated]
commit = true
verify_drift = true
# OW-ADR-0022: this repository keeps docs/generated/HISTORY.md beside
# docs/generated/CURRENT.md — every subject that ever existed, expanded.
history = true

# The verifier `war verify <alias> --run` hands each bundle to (OW-WAR-0117;
# docs/VERIFICATION.md). A separate `claude -p` process with no tool, no MCP
# server, no settings and an empty working directory; it reads only the
# bundle `war` compiled. Its verdicts are its own; the flags on each verdict
# are written by the script from how it is built, not by the model.
[verify]
verifier_argv = ["tools/verifier/claude-verifier.sh"]
verifier_timeout_secs = 900

# §46.1's nine dimensions, declared for the arrangement above — every
# verification this repository runs through `[verify]`. Each ingested verdict
# is still judged on its OWN flags (`verify.rs`, admissible_for); this table
# only says what the configured verifier provides, so `war check` can report
# §46.3's minimums per assurance level.
#
# Until 2026-09-23 every value here was false: the performer verified its own
# work, which §27.4 says is not independence. OW-WAR-0117 changed the
# arrangement, not the words.
[independence]
performer_transcript_blind = true       # the bundle carries no transcript
performer_rationale_blind = true        # nor rationale or journal; no memory is loaded
separate_writable_workspace = true      # an empty temporary directory, and nothing to write with
cannot_modify_subject_artifacts = true  # no tool and no MCP server
cannot_modify_gate_definition = true    # no tool and no MCP server
cannot_modify_gate_fixtures = true      # no tool and no MCP server
separate_context_compilation = true     # `war` compiles the bundle, not the performer
distinct_model_required = false         # per verdict: true only when CLAUDE_PERFORMER_MODEL differs
distinct_human_required = false         # no human verifies here; §27.4, no four-eyes claim

# OW-WAR-0042: the drafting agent over §75.2 — Claude Code non-interactive,
# version recorded per run under the Warrant's evidence/.
[plan]
drafter_argv = ["conformance/fixtures/drafter/claude-drafter.sh"]
drafter_name = "claude-code (conformance/fixtures/drafter/claude-drafter.sh)"
drafter_timeout_secs = 600

# The reasons this repository's signer reaches for, written once so a batch of
# acts costs a keystroke each instead of a sentence each (OW-WAR-0069). The
# tool drafts the facts; a preset adds the human's own words, verbatim.
[[sign.preset]]
key = "1"
label = "a slice of the 1.0 plan"
meaning = "The delivered bytes moved with a slice of the 1.0 plan; each commit states its own change, and this records that the artifact moved with them."
acts = ["correct"]
kind = "behaviour-change"

[[sign.preset]]
key = "2"
label = "the Apache-2.0 relicense"
meaning = "The SPDX identifier moved with the relicense to Apache-2.0 (OW-ADR-0017); the licence changed and the behaviour did not."
acts = ["correct"]
kind = "behaviour-change"

[[sign.preset]]
key = "3"
label = "a refusal was added"
meaning = "This file now refuses something it used to allow; the refusal is named in the commit that added it."
acts = ["correct"]
kind = "added-refusal"

[[sign.preset]]
key = "4"
label = "the plan authorized it"
meaning = "Authorized as a slice of the approved 1.0 plan; the contract is the one the record compiles to now."
acts = ["authorize"]

[[sign.preset]]
key = "5"
label = "obligations established, blind verification on record"
meaning = "Every declared obligation is established by a verification whose verifier is not the performer, and the thirteen are as the record reports them."
acts = ["resolve"]

# The agent that performs an agent stage (OW-WAR-0069). One at a time: nothing
# here contains a performer, so `max_concurrent` above 1 is refused.
[perform]
performer_argv = ["conformance/fixtures/performer/echo-submission.sh"]
performer_timeout_secs = 600
max_concurrent = 1
