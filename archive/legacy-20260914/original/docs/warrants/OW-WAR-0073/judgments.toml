[[judgment]]
id = "J-001"
kind = "residual_risk_acceptance"
statement = "ratatui and crossterm are MIT and inside deny.toml's allowlist, and neither pulls an async runtime. Read from deny.toml and the lock before drafting; not yet proven by a gate run on the new graph."
actor = "Brian Lam"
acting_role = "risk_acceptor"
meaning = "Accepting residual risk A-002 for OW-WAR-0073: if the assumption is false, the consequence is: If an executor crate enters the graph, OW-ADR-0014's refusal is engaged and the TUI needs its own async ADR or a different library. Presented on a terminal by `war sign 1.0.0` and confirmed by the signer; the decision is the signer's and the template is the tool's."
basis_refs = ["assumption://A-002"]
authority = "authorized"

[[judgment]]
