schema: "oh.war/amendment/v1"

id: "AM-001"
band: "manual_revision"
reason: "OW-WAR-0016 was authored before the Gate Registry existed, so its four obligations name evidence but cite no gate. §56.1 requirement 5 (every required gate has admissible result) reads unmet for a Warrant that names no gate — correctly: nothing was asked. Every obligation is otherwise established by an admissible verification. This amendment adds the gate citation each obligation's evidence already relies on, `gate://software.repo.war-check@1.0.0`, whose run is the plant battery the obligations name. Authorized by the owner on the express instruction of 2026-09-02; wording drafted by the performer `claude`."
governing_adr_or_policy: "sas://WAR-SAS-43.5"
artifact_admissibility: "remain_admissible"
restart_or_repair_instruction: "Continue. No artifact changes; the assurance atom gains four `gate:` lines, the contract digest moves, and revision 2 is authorized against the amended contract."
re_preflight_required: "false"
authorizer: "Brian Lam"
effective_time: "2026-09-02"

semantic_diff:
  - element: "obligations"
    before: "OBL-001..OBL-004 each name evidence (a migration without loss; a plant and its refusal) and cite no gate."
    after: "OBL-001..OBL-004 each additionally cite `gate://software.repo.war-check@1.0.0`, the gate that runs the named plants."

