kind = "residual_risk_acceptance"
statement = "Treating a retitled requirement as architecture-changing but not as a removal is the right boundary."
actor = "Brian Lam"
acting_role = "risk_acceptor"
meaning = """The owner accepts this residual risk for OW-WAR-0058: if the assumption is false, the consequence is A retitle that inverts a requirement's meaning passes the stability check, and only the ADR the acceptance requires can catch it. Response drafted by the performer `claude` on the repository owner's express instruction of 2026-09-02 ("You should manually authorize each of the warrants. I give you my express permission to approve these things."); the decision is the owner's, the wording is the agent's."""
basis_refs = ["assumption://A-002"]
authority = "authorized"

[[judgment]]
