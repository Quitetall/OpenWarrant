[[judgment]]
id = "J-001"
kind = "residual_risk_acceptance"
statement = "A revision record that is immutable by type and checked on load is sufficient until the SAS is a controlled Knowledge Fabric document."
actor = "Brian Lam"
acting_role = "risk_acceptor"
meaning = """The owner accepts this residual risk for OW-WAR-0058: if the assumption is false, the consequence is An accepted record is edited by hand to a different digest in a single commit, and the only thing that notices is a reviewer reading the diff. Response drafted by the performer `claude` on the repository owner's express instruction of 2026-09-02 ("You should manually authorize each of the warrants. I give you my express permission to approve these things."); the decision is the owner's, the wording is the agent's."""
basis_refs = ["assumption://A-001"]
authority = "authorized"

[[judgment]]
