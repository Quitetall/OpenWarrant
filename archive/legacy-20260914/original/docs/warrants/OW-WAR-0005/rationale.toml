schema = "oh.war/rationale/v1"

# §36.2 — accepted residual risk.
#
# Each entry transcribes this Warrant's own "## Residual Risk" section from its
# assurance atom, which stated the risk in prose that nothing could read.
#
# `judgment_ref` is EMPTY, and deliberately. The status names the class of
# assumption — a residual risk, to be accepted — while `judgment_ref` is where an
# acceptance is recorded. Nobody has accepted these. §27.2 forbids an agent
# accepting organizational residual risk, so the field stays empty until a human
# signs a judgment through `war authorize`, and `war resolve` reports
# requirements 9 and 11 unmet until one does.

[[assumption]]
id = "A-001"
statement = "`war check` handling a decision Warrant correctly can be assumed, though the corpus is all delivery."
epistemic_status = "accepted_residual_risk"
consequence_if_false = "The first decision Warrant written is validated by code no fixture ever exercised."
judgment_ref = ""

[[assumption]]
id = "A-002"
statement = "Two runs on one host satisfy §91.1 test 1's two supported hosts, as stated in the claim."
epistemic_status = "accepted_residual_risk"
consequence_if_false = "The determinism claim covers one architecture while reading as though it covers two."
judgment_ref = ""
