schema: "oh.war/milestones/v1"

milestones:
  - id: "M1"
    title: "Bytes final: relicensed, register edited"
    stage_refs: ["STAGE-001", "STAGE-002"]
    obligation_refs: ["OBL-001"]
  - id: "M2"
    title: "Signed: SAS, authorizations, OW-WAR-0042"
    depends_on: ["M1"]
    stage_refs: ["STAGE-003", "STAGE-004", "STAGE-005"]
    obligation_refs: ["OBL-002"]
  - id: "M3"
    title: "Corrected and tagged"
    depends_on: ["M2"]
    stage_refs: ["STAGE-006", "STAGE-007"]
    obligation_refs: ["OBL-003"]

stages:
  - id: "STAGE-001"
    title: "Relicense to Apache-2.0 (RELICENSING.md steps 1-6)"
    executor_kind: "human"
    responsibility_tier: "T3"
  - id: "STAGE-002"
    title: "Add oh.war/dsse to the principal's namespaces in allowed_signers"
    executor_kind: "human"
    responsibility_tier: "T3"
  - id: "STAGE-003"
    title: "Accept SAS 1.0.0 with OW-ADR-0016"
    executor_kind: "human"
    responsibility_tier: "T3"
  - id: "STAGE-004"
    title: "Authorize OW-WAR-0064, OW-WAR-0065, OW-WAR-0066"
    executor_kind: "human"
    responsibility_tier: "T3"
  - id: "STAGE-005"
    title: "Review and apply OW-WAR-0042's recorded draft; verify blind; resolve"
    executor_kind: "human"
    responsibility_tier: "T3"
  - id: "STAGE-006"
    title: "Sign every correction on final bytes"
    executor_kind: "human"
    responsibility_tier: "T3"
  - id: "STAGE-007"
    title: "Tag v1.0.0"
    executor_kind: "human"
    responsibility_tier: "T3"
