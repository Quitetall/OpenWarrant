schema: "oh.war/milestones/v1"

milestones:
  - id: "M1"
    title: "The batch document: a record, a digest, a signature"
    stage_refs: ["STAGE-001", "STAGE-002"]
    obligation_refs: ["OBL-001"]
  - id: "M2"
    title: "The ingest: each act writes its own record, or none does"
    depends_on: ["M1"]
    stage_refs: ["STAGE-003"]
    obligation_refs: ["OBL-002", "OBL-003"]
  - id: "M3"
    title: "Attested, planted, documented"
    depends_on: ["M2"]
    stage_refs: ["STAGE-004", "STAGE-005"]
    obligation_refs: ["OBL-004"]

stages:
  - id: "STAGE-001"
    title: "oh.war/batch/v1 in core: types, canonical digest, validate"
    executor_kind: "agent"
    executor_ref: "agent://claude-code"
    responsibility_tier: "T2"
    context_sections: ["40-work-order.md#Deliverables", "40-work-order.md#Premade Instructions"]
    budget_tokens: 14000
  - id: "STAGE-002"
    title: "war sign --batch drafts the document and signs it once"
    executor_kind: "agent"
    executor_ref: "agent://claude-code"
    responsibility_tier: "T2"
    context_sections: ["40-work-order.md#Deliverables", "20-basis.md#Governing text"]
    budget_tokens: 16000
  - id: "STAGE-003"
    title: "The ingest loop and its nine refusals, reusing each act's ingest"
    executor_kind: "agent"
    executor_ref: "agent://claude-code"
    responsibility_tier: "T2"
    context_sections: ["40-work-order.md#Deliverables", "40-work-order.md#Premade Instructions"]
    budget_tokens: 20000
  - id: "STAGE-004"
    title: "Attestations over a batch, and war console's batch path"
    executor_kind: "agent"
    executor_ref: "agent://claude-code"
    responsibility_tier: "T2"
    context_sections: ["40-work-order.md#Deliverables"]
    budget_tokens: 16000
  - id: "STAGE-005"
    title: "The first real batch: the owner signs the queue once"
    executor_kind: "human"
    responsibility_tier: "T2"
