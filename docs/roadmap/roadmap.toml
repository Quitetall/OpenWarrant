# The roadmap: one per program, beside the SAS (OW-ADR-0023, OW-WAR-0114).
#
# The SAS says what the system is; this says in what order it is built —
# sequencing, dependency, priority and phase (SAS §6.3). It lists no
# Warrants and carries no status: a Warrant joins a phase through its own
# `[[roadmap]]` ref, and a phase is achieved when its `exit` Warrant
# resolves satisfied. Both are computed, never written here.
#
# A change to the atoms below is proposed with `war roadmap propose` (or
# made by keystroke in `war roadmap` / the app) and takes effect when a
# human accepts the revision: one `war sign roadmap --ssh-sign` dialog.
schema = "oh.war/roadmap/v1"
uuid = "01a0cd3a-0a24-74cb-9a4b-5a83dfe420f9"
program = "OpenWarrant"
prefix = "OW"

[[atoms]]
ordinal = 10
role = "intent"
path = "atoms/10-intent.md"

[[atoms]]
ordinal = 20
role = "phases"
path = "atoms/20-phases.yaml"

