version = "1.0.0-rc.2"
source = "docs/sas/drafts/1.0.0-rc.2/WAR_Software_Architecture_Specification.md"
sha256 = "e003e0926b912793fa43c28b9b85cffb9f15ccaedcd99989973e2455022920d8"
state = "proposed"
predecessor = "1.0.0"
architecture_changing = true

[requirements]
WAR-SAS-RQ-001 = "Document identity is stable; legacy UUIDs are preserved and new shared identities should use UUIDv7"
WAR-SAS-RQ-002 = "Local aliases do not substitute for source identity or authority"
WAR-SAS-RQ-003 = "Selected federation authorities allocate their official enterprise identity"
WAR-SAS-RQ-004 = "Registration and import do not silently transfer source ownership"
WAR-SAS-RQ-005 = "Federated cross-repository relations retain their issuing and local authorities"
WAR-SAS-RQ-010 = "New documents and legacy authored atoms remain editable sources before immutable approval"
WAR-SAS-RQ-011 = "Bound source content changes through its owning authority"
WAR-SAS-RQ-012 = "Generated views are regenerated from sources rather than edited as authorities"
WAR-SAS-RQ-013 = "Document composition is typed, ordered, and deterministic"
WAR-SAS-RQ-014 = "Human and canonical machine views derive from one captured source basis"
WAR-SAS-RQ-015 = "Missing required source content prevents a complete task packet"
WAR-SAS-RQ-020 = "Material governing architecture decisions remain first-class ADRs; in-scope advice is not a new decision"
WAR-SAS-RQ-021 = "Decision indexes are generated from source records"
WAR-SAS-RQ-022 = "Work traces to applicable SAS requirements; no SAS or roadmap is required for every valid prototype draft"
WAR-SAS-RQ-023 = "Child Warrants cite their exact parent basis"
WAR-SAS-RQ-024 = "Children do not rewrite parent rationale"
WAR-SAS-RQ-025 = "Successor work preserves earlier Warrants and their historical standing"
WAR-SAS-RQ-030 = "Approved contract snapshots are immutable"
WAR-SAS-RQ-031 = "Progress cannot amend a contract"
WAR-SAS-RQ-032 = "State separates lifecycle, execution condition, result, currency, and acceptance or qualification standing"
WAR-SAS-RQ-033 = "Material amendment creates a new contract revision"
WAR-SAS-RQ-034 = "Prior attempts retain their original basis"
WAR-SAS-RQ-035 = "Workflow readiness checks its required inputs; document validity is separate"
WAR-SAS-RQ-036 = "Successor work preserves old delivered bytes and evidence without freezing a live pathname; corrections remain separate"
WAR-SAS-RQ-040 = "Milestones and execution stages are distinct"
WAR-SAS-RQ-041 = "Typed stage ports remain a selected orchestration adapter contract"
WAR-SAS-RQ-042 = "An executing actor receives an exact task dispatch basis"
WAR-SAS-RQ-043 = "Task context exposes basis, required outputs, constraints, limits, and stopping conditions"
WAR-SAS-RQ-044 = "Execution authority is explicit and bounded by human-approved effective policy"
WAR-SAS-RQ-045 = "Replay, repair, and worker recovery retain distinct attempt history and limits"
WAR-SAS-RQ-046 = "Entry token estimates include rendering overhead; exceeding a required-content budget is a refusal"
WAR-SAS-RQ-050 = "Assurance qualification decomposes completion claims into bounded obligations"
WAR-SAS-RQ-051 = "Claims declare scope bounded by their evidence"
WAR-SAS-RQ-052 = "Claim, evidence, observation, inference, judgment, acceptance, and qualification remain distinct"
WAR-SAS-RQ-053 = "Performer reports cannot satisfy independent verification"
WAR-SAS-RQ-054 = "Required unknown or failed checks block assurance qualification"
WAR-SAS-RQ-055 = "Assurance requires adequacy evidence with applicable refusal and control cases"
WAR-SAS-RQ-056 = "Required check definitions and expectations are versioned and protected from performer changes during verification"
WAR-SAS-RQ-057 = "Invalidated evidence changes dependent qualification standing without rewriting history"
WAR-SAS-RQ-058 = "Residual risk requires explicit authorized human acceptance and cannot waive a failed baseline requirement"
WAR-SAS-RQ-059 = "Human acceptance binds exact contract, result, and assurance evidence"
WAR-SAS-RQ-060 = "Knowledge Fabric owns authority and lifecycle for its selected federated workflow, not every standalone compiler use"
WAR-SAS-RQ-061 = "OpenWarrant owns standalone standard and context compilation; Liminal is an optional adapter"
WAR-SAS-RQ-062 = "Selected Katana adapters retain Katana runtime and PromptIR ownership"
WAR-SAS-RQ-063 = "Selected BLUT adapters retain BLUT typed execution ownership"
WAR-SAS-RQ-064 = "OpenWarrant compiler does not require or duplicate sibling runtime kernels"
WAR-SAS-RQ-065 = "Native systems retain their artifact and source authority"
WAR-SAS-RQ-070 = "Reference authoring and compilation work offline without a model"
WAR-SAS-RQ-071 = "Agent-assisted planning returns reviewable structured source proposals"
WAR-SAS-RQ-072 = "Proposals are validated before source writes and cannot grant themselves authority"
WAR-SAS-RQ-073 = "Planning identifies material architecture decisions for ADR proposals"
WAR-SAS-RQ-074 = "Document and compiler checks are deterministic and agent-free"
WAR-SAS-RQ-075 = "Generated views are checked against their exact source basis"
WAR-SAS-RQ-076 = "Federated controlled actions use the owning authority interface rather than direct status edits"
WAR-SAS-RQ-077 = "Selected code, document, and run workflows each require their own observed gates and examples"
WAR-SAS-RQ-080 = "Canonical structured preservation uses RFC 8785 JSON"
WAR-SAS-RQ-081 = "Digests use explicit algorithms and versioned domains; original source bytes remain recoverable"
WAR-SAS-RQ-082 = "Preservation exports retain contract, sources, receipts, assurance and acceptance when present without inventing missing history"
WAR-SAS-RQ-083 = "Export-import-export preserves semantic identity and original evidence bytes"
WAR-SAS-RQ-084 = "Historical superseded, disputed and annulled records remain available"
WAR-SAS-RQ-085 = "Existing SSH-signed acts retain their portable attestations and original subjects"
WAR-SAS-RQ-090 = "Master context is a generated assembly of exact source revisions; source authority remains at its origin"
WAR-SAS-RQ-091 = "Binding units retain exact text with required definitions, conditions, exceptions and schemas"
WAR-SAS-RQ-092 = "Context pointers have stable targets, explicit references and versioned structured conditions"
WAR-SAS-RQ-093 = "Unknown applicability includes an available rule and its dependencies while preserving uncertainty and authority blockers"
WAR-SAS-RQ-094 = "Required dependency coverage is explicit, terminating and provenance-preserving; inconsistent or unresolved required meaning cannot be complete"
WAR-SAS-RQ-095 = "Background summaries preserve source provenance, trust, classification and taint and never replace binding text"
WAR-SAS-RQ-096 = "Complete explicit inputs compile reproducibly without a model call or mandatory sibling runtime"
WAR-SAS-RQ-097 = "Agent packets contain a task brief, binding context, reference catalog and integrity-bound source manifest"
WAR-SAS-RQ-098 = "V1 exports all required task context for offline reading without the original repository or running service"
WAR-SAS-RQ-099 = "Optional resolvers and absent optional references remain distinct from required bytes actually supplied"
WAR-SAS-RQ-100 = "Role-specific packets preserve common requirements, independence and access to full required evidence"
WAR-SAS-RQ-101 = "Budget accounting covers compiler rendering overhead and distinguishes estimates from observed harness usage"
WAR-SAS-RQ-102 = "Required context is never discarded to satisfy a budget"
WAR-SAS-RQ-103 = "Source, scope, selection, policy and representation changes invalidate affected projections without rewriting earlier packets"
WAR-SAS-RQ-104 = "Stable source-unit identities survive heading changes and retain exact source locators"
WAR-SAS-RQ-105 = "Task instructions expose bounded outputs and observable completion criteria with supporting material progressively disclosed"
WAR-SAS-RQ-106 = "Generators derive indexes and digests without requiring manual duplicate metadata maintenance"
WAR-SAS-RQ-107 = "Context optimization claims are bounded by repeated task evaluation including omissions, wrong actions, tokens and human effort"
WAR-SAS-RQ-108 = "OpenWarrant 1.0.0 Stable follows library and CLI/compiler conformance; workflow integrations follow afterward"
WAR-SAS-RQ-110 = "Minimal Markdown documents are valid independently of workflow readiness"
WAR-SAS-RQ-111 = "Structured source grammar and extension interpretation are versioned and reject unsupported required semantics"
WAR-SAS-RQ-112 = "A named policy may automate work or governance adoption but never fabricate human acceptance or assurance"
WAR-SAS-RQ-113 = "Only an authorized human approves changes to effective automation policy, including indirect changes"
WAR-SAS-RQ-114 = "Common assurance requires independent evidence and human acceptance for one exact Warrant result"
WAR-SAS-RQ-115 = "Later qualification preserves actual fixture timing and does not claim fixtures-before-work retrospectively"
WAR-SAS-RQ-116 = "Unreviewed prototype results may rest without mandatory acceptance tasks"
WAR-SAS-RQ-117 = "Default main-branch merge requires assurance; human policy may permit unmarked merges; deployment is separate"
WAR-SAS-RQ-118 = "Writers serialize per Warrant worktree and replacement requires proof prior writer cannot write"
WAR-SAS-RQ-119 = "Blocking hotline questions pause affected work and dependents while independent work continues"
WAR-SAS-RQ-120 = "Repair count is user-selectable with three cycles as fallback; unknown cost never implies an enforced cap"
WAR-SAS-RQ-121 = "Phase 1 exposes and tests every scoped primitive before supported compiler and CLI composition"

