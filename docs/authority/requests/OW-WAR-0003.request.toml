statement = "a valid Basis lowers to the IR"

[[obligations]]
id = "OBL-002"
statement = "canonical output conforms to RFC 8785"

[[obligations]]
id = "OBL-003"
statement = "digests are domain-separated"

[[obligations]]
id = "OBL-004"
statement = "canonical output is host-independent"

[[residual_risks]]
assumption_id = "A-001"
statement = "Same-host determinism is sufficient evidence for the canonicalization claim, per OBL-004's stated limitation."
consequence_if_false = "A second architecture disagrees on canonical bytes and every cross-system digest computed before that point is wrong."
judgment_ref = ""

[[residual_risks]]
assumption_id = "A-002"
statement = "Leaving the decision profile unexercised does not weaken the IR claim."
consequence_if_false = "The IR is proven only against delivery Warrants, and a decision Warrant lowers wrongly the first time one is written."
judgment_ref = ""

