    title: "Prepare the exact adoption decision and fixtures"
    stage_refs: ["STAGE-001"]
    obligation_refs: ["OBL-001", "OBL-002"]
  - id: "M2"
    title: "Implement and observe source-set acceptance"
    depends_on: ["M1"]
    stage_refs: ["STAGE-003"]
    obligation_refs: ["OBL-001", "OBL-002", "OBL-004", "OBL-005"]
