    context_sections: ["20-basis.md#Required context", "40-work-order.md#Exact implementation contract", "60-assurance.md#Acceptance Obligations"]
    budget_tokens: 32000
  - id: "STAGE-002"
    title: "Verify implementation, review corrections and accept architecture"
    executor_kind: "human"
    responsibility_tier: "T2"
    context_sections: ["40-work-order.md#Frozen surfaces and correction route", "60-assurance.md#Acceptance Obligations"]
