schema = "oh.war/verification-response/v1"
warrant = "OW-WAR-0001"

[[verifications]]
obligation = "OBL-001"
disposition = "not_established"
evidence = "obligation_evidence for OBL-001 shows the term 'cargo build --workspace' with shown_in: [] (it appears nowhere in the bundle) and 'rustc --version' shown only inside D-004 (.github/workflows/ci.yml), where it is merely a CI step definition ('cargo --version') rather than captured output of an actual run. The one gate run present, GR-software.repo.war-check@1.0.0, invoked 'war check --generated' — a Warrant-corpus record check — whose own stdout footer states 'war check does not invoke gates', so it supplies no build exit status or rustc version for any actual compilation. No evidence of the workspace having been built is carried."
performer = "claude"
[verifications.verifier]
actor = "claude-verifier (claude-sonnet-5)"
kind = "agent"
[verifications.verifier.independence]
performer_transcript_blind = true
performer_rationale_blind = true
separate_writable_workspace = true
cannot_modify_subject_artifacts = true
cannot_modify_gate_definition = true
cannot_modify_gate_fixtures = true
separate_context_compilation = true
distinct_model_required = true
distinct_human_required = false

