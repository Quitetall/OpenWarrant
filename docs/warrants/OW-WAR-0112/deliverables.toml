schema = "oh.war/deliverables/v1"

# §37.1. Declared by the performer — declaring a deliverable is a performer
# statement (§51), which is permitted. It is the VERIFICATION of the obligations
# these support that must be independent (§46), not the declaration itself.
#
# Under OW-ADR-0021 the SET of (id, target_ref) pairs below is what the
# authorizer signs and what this Warrant then governs. It is complete at
# authorization: every path this Warrant will touch is here, including the
# ones that do not exist yet. Those carry `content_addressed = false` until
# they are delivered; their digests are recorded then, and adding a digest
# does not change the set. Adding a PATH after authorization would, and is
# reported as `deliverable.undeclared-at-authorization`.
#
# `contract_digest` is "unrecorded" because it is true: no authorized contract
# revision exists for this Warrant yet (§28.4 needs a human).

