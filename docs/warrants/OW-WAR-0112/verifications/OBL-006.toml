obligation = "OBL-006"
disposition = "not_established"
evidence = """Four of the five evidence clauses are confirmed by gate run GR-ops.conformance.plants@1.1.0's stdout, matching plant conformance/plants.d/97-tui.sh (D-034) line-for-line: 'no terminal, no app exit 2, tui.no-tty, usage, names war status --json, no escape' for `war </dev/null`; 'war tui from a pipe exit 2, tui.no-tty'; 'war --json refuses by name exit 2, tui.json, names war console/status --json' (and the same for `war tui --json`); and 'war --json sdk --request - an envelope (exit 1), not usage, not the app' confirming the sdk argv scan still answers with an envelope. The fifth clause, 'every embedded document renders in the Help pane without panic', is only shown as source: D-030 (tui/mod.rs) contains the unit test `every_embedded_document_renders_in_the_help_pane` with a doc-comment naming it OBL-006 evidence, but no gate run in the bundle (neither ops.conformance.plants@1.1.0 nor software.repo.war-check@1.0.0) executes cargo's unit tests or reports this test's result — D-034's own check on this point is limited to grepping that docs/TUI.md names the nine panes, not that documents render without panicking in the app. Separately, the only pty-based proof of the app actually opening at a terminal is `script -qec "$WAR tui --panic-after-setup"` (D-034, gate line 'a panic restores the terminal'), which exercises `war tui` by name, not bare `war` with no arguments; that bare `war` shares the same code path is asserted only in D-031/D-030 source comments, not demonstrated by a pty run. Because the obligation's own evidence includes a claim (document rendering) with no run confirmation, and the core 'opens the app at a terminal' half for bare `war` specifically is inferred from source rather than shown by a terminal test, the bundle does not carry enough to establish the full obligation."""
performer = "claude"

[verifier]
actor = "claude-verifier (claude-sonnet-5)"
kind = "agent"

[verifier.independence]
performer_transcript_blind = true
performer_rationale_blind = true
separate_writable_workspace = true
cannot_modify_subject_artifacts = true
cannot_modify_gate_definition = true
cannot_modify_gate_fixtures = true
separate_context_compilation = true
distinct_model_required = true
distinct_human_required = false
