obligation = "OBL-001"
disposition = "not_established"
evidence = "D-001 (crates/openwarrant-cli/src/check.rs, check_traceability) shows the traceability.unknown-requirement diagnostic logic that would refuse an implements ref naming a §106 row absent from known_requirements. D-003 (conformance/plants.d/00-corpus.sh) is the plant battery's shell source, but the specific plant named in the obligation's evidence text — 'a requirement reference §106 does not contain' — does not appear among the plant entries actually surfaced in this bundle (the separately-listed plants array only shows an unrelated 'implements entry with no contribution stated' plant and a corrections-response snippet, neither of which is the RQ-999 unknown-requirement plant); the only RQ-999-like string visible in D-003's shown text is an unrelated SAS-diff positive control ('a candidate SAS that appends a requirement id' / WAR-SAS-RQ-999), not the implements/§106 plant. The bundle's single gate_runs entry (GR-software.repo.war-check@1.0.0) is a plain `war check --generated` over the unmutated committed corpus — its stdout excerpts show ordinary PASS/WARN lines for OW-WAR-0063 with no mutation applied or plant battery invoked. Per §39.3, code plus an unexecuted plant script is a plan, not an executed attack, so the refusal this obligation claims is not shown to have actually occurred."
