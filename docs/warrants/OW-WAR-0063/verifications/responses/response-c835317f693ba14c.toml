schema = "oh.war/verification-response/v1"
warrant = "OW-WAR-0063"

[[verifications]]
obligation = "OBL-002"
disposition = "not_established"
evidence = "The bundle shows only source code, not executed results, for the plants and tests OBL-002 names. D-003 (conformance/plants.d/00-corpus.sh) contains the bash source of the OW-WAR-0063 plants (duplicate milestone id, contribution-unstated, CORPUS_STATUS.md hand-edit, unknown-requirement), but §39.3's own rule — cited in atoms/10-intent.md — is that a script naming a rule and a detail is a plan, not an executed attack; no battery run log or receipt for running conformance/plants.d/00-corpus.sh is present. The single gate_runs entry (GR-software.repo.war-check@1.0.0) is a plain `war check --generated` over the unmutated committed corpus, whose stdout excerpts show only ordinary corpus-level PASS/WARN lines for OW-WAR-0063 (manifest.valid, deliverable.digests, etc.) — it contains no evidence of any plant mutation being applied or rejected. D-002 (adr.rs) and D-004 (corpus_status.rs) likewise show only the test source for supersession_relations_are_read_in_both_directions, the_banner_precedes_the_title_and_the_renderer_divides_nothing, and every_committed_war_json_carries_the_sas_pin, with no test-run output confirming they passed. Further, D-001 (crates/openwarrant-cli/src/check.rs), which per the work order would carry the diagnostic-shape (§71.7), UUID-allocation, and amendment-digest-preservation tests, is listed in deliverables_not_carried and is entirely absent from this bundle, so those named controls cannot be evaluated at all. The prior_verifications entry asserts these controls passed, but that is another agent's account rather than raw evidence in this bundle, and cannot substitute for an execution record. Given absent, source-only, or third-party-asserted evidence throughout, OBL-002's claim that every named control has an executed attack is not established."
performer = "claude"
[verifications.verifier]
actor = "claude-verifier (claude-sonnet-5)"
kind = "agent"
[verifications.verifier.independence]
performer_transcript_blind = true
performer_rationale_blind = true
separate_writable_workspace = true
cannot_modify_subject_artifacts = true
cannot_modify_gate_definition = true
cannot_modify_gate_fixtures = true
separate_context_compilation = true
distinct_model_required = true
distinct_human_required = false
