schema = "oh.war/verification-response/v1"
warrant = "OW-WAR-0122"

[[verifications]]
obligation = "OBL-002"
disposition = "established"
evidence = "D-002 (repo.rs) shows atom.header is emitted strictly via Diagnostic::error, so any occurrence in a `war check` run is counted in that run's ERROR tally. The gate run GR-software.repo.war-check@1.0.0 (receipt subject_digests include tree:e54ccac17a000db9430a08ded5ae9ad1923067b0, the same tree cited by the passing GR-ops.conformance.plants@1.1.0 run, i.e. the commit the plants ran on) has verdict pass/exit_result pass, and its stdout's final tally line reads '2068 pass · 240 warn · 0 unknown · 0 error (worst: WARN)' — zero errors across the whole corpus, which necessarily means no atom.header error fired anywhere, including on OW-WAR-0122's own atoms (the excerpted lines show PASS manifest.valid, deliverable.digests, identity.atom-mismatch for OW-WAR-0122 with no atom.header line). The one WARN naming this same gate ('evidence.stale-binding') concerns bookkeeping staleness of a prior receipt file, not an atom.header failure, and is WARN- not ERROR-severity, so it does not affect the zero-error count. This satisfies OBL-002's stated evidence ('war check on the unmodified corpus reports no atom.header error; the battery's clean run is the record') within its scope of the corpus at the commit the plant runs on."
performer = "claude"
[verifications.verifier]
actor = "claude-verifier (claude-sonnet-5)"
kind = "agent"
[verifications.verifier.independence]
performer_transcript_blind = true
