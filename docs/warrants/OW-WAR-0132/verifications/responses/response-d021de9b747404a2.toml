evidence = "D-006 (conformance/plants.d/52-hotline-defaults.sh, carried in full, not truncated) defines the OBL-004 checks exactly to the obligation's scope: 'max_recoveries = 1' runs STAGE-001 three times with says-nothing.sh via hd_run3, asserting via hd_endings() that the journal shows 'failed,failed' before the third run is rejected with perform.recovery-limit and no perform.failed; 'max_repairs = 1' runs echo-submission.sh three times, asserting 'answered,answered' before the third is rejected perform.repair-limit; and 'a failed run is not a repair' runs echo, says-nothing, echo with max_repairs=1, asserting exit 0, perform.answered, no repair/recovery-limit firing, and journal endings 'answered,failed,answered'. The gate run GR-ops.conformance.plants@1.1.0 (verdict pass, receipt exit_result pass, run 2026-09-27) has a stdout excerpt spanning lines 262-279 that directly shows all three result lines: 'ok max_recoveries = 1 failed, failed, then rejected by perform.recovery-limit', 'ok max_repairs = 1 answered, answered, then rejected by perform.repair-limit', and 'ok a failed run is not a repair answered, failed, answered; no limit fired' — these are the plant's own hd_ok lines, only reached when its assertions (matching journal outcomes to the runs performed) hold. The same stdout's tail reports the whole battery finished '1270 passed, 0 failed', consistent with none of these three cases failing. This is corroborated at the unit level by D-002 (crates/openwarrant-cli/src/perform.rs), whose carried excerpt includes the pure attempt_of() counting function and its test repairs_and_recoveries_are_counted_apart, which asserts the same repair/recovery numbering (e.g. answered,failed,answered yields Repair(2), not consuming a repair on failure). Together the plant's passing integration-level assertions against real journal output and the gate's zero-failure verdict establish the obligation within its stated scope."
performer = "claude"
