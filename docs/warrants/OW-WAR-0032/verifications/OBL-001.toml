obligation = "OBL-001"
disposition = "not_established"
evidence = "deliverables is empty, so no generated JSON Schema or corpus-validation artifact tied to OW-WAR-0032 is in the bundle. obligation_evidence for OBL-001 lists no named_paths and no terms at all. The only gate evidence, GR-software.repo.war-check@1.0.0, shows a truncated stdout whose visible excerpts (lines 537-550, 2598, 2781, 2861) are meta-checks over the Warrant record itself (manifest.valid, traceability.refs, journal.append-only, authority.signed, gate.resolved, milestones.valid, obligations.valid) — none of them validate generated schemas against the IR/manifest/Dispatch/Submission/gate corpus. The gate's own NOT CHECKED section states `war check` does not invoke `war gate --run`, so 'nothing here is evidence that a Warrant's acceptance gates were run,' confirming this run cannot stand in for the corpus-validation evidence OBL-001 requires."
performer = "claude"

[verifier]
actor = "claude-verifier (claude-sonnet-5)"
