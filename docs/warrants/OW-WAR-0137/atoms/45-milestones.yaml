schema: "oh.war/milestones/v1"

milestones:
  - id: "M1"
    title: "The assignment record, listed in the authorization request and bound by its signature"
    stage_refs: ["STAGE-001"]
    obligation_refs: ["OBL-001"]
  - id: "M2"
    title: "Assignment narrows eligibility; war sign --list and war inbox per actor"
    depends_on: ["M1"]
    stage_refs: ["STAGE-002"]
    obligation_refs: ["OBL-002"]
  - id: "M3"
    title: "A verdict on an assigned Warrant comes from the assigned verifier who holds the role"
    depends_on: ["M1"]
    stage_refs: ["STAGE-003"]
    obligation_refs: ["OBL-003"]
  - id: "M4"
    title: "TEAMS.md, the THREAT_MODEL row, 57-teams.sh, honest review claims"
    depends_on: ["M2", "M3"]
    stage_refs: ["STAGE-004"]
    obligation_refs: ["OBL-001", "OBL-002", "OBL-003", "OBL-004"]

  - id: "MB"
    title: "The battery, run as the gate these obligations cite"
    depends_on: ["M1", "M2", "M3", "M4"]
    stage_refs: ["STAGE-005"]
    obligation_refs: ["OBL-001", "OBL-002", "OBL-003"]

stages:
  - id: "STAGE-001"
    title: "assignment.rs; authorize.rs lists and echoes the assignment digest"
    executor_kind: "agent"
    executor_ref: "agent://claude-code"
    responsibility_tier: "T2"
    context_sections: ["40-work-order.md#Deliverables", "40-work-order.md#Premade Instructions"]
    budget_tokens: 14000
  - id: "STAGE-002"
    title: "sign.rs eligible/choose_actor narrowed; --list --as; inbox --as"
    executor_kind: "agent"
    executor_ref: "agent://claude-code"
    responsibility_tier: "T2"
    context_sections: ["40-work-order.md#Deliverables"]
    budget_tokens: 12000
  - id: "STAGE-003"
    title: "verify.rs refuses unassigned and role-less verifiers on assigned Warrants"
    executor_kind: "agent"
    executor_ref: "agent://claude-code"
    responsibility_tier: "T2"
    context_sections: ["40-work-order.md#Deliverables"]
    budget_tokens: 8000
  - id: "STAGE-004"
    title: "docs and plants"
    executor_kind: "agent"
    executor_ref: "agent://claude-code"
    responsibility_tier: "T2"
    context_sections: ["40-work-order.md#Deliverables"]
    budget_tokens: 8000

  - id: "STAGE-005"
    title: "Run the conformance battery"
    executor_kind: "service"
    responsibility_tier: "T1"
    executor_ref: "gate://ops.conformance.plants@1.0.0"
    wall_time_seconds: 1800
