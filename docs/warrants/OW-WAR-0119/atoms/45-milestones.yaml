    title: "identity_check.rs, its call in check.rs, blut.rs stage identity, 51-identity.sh"
    executor_kind: "agent"
    executor_ref: "agent://claude-code"
    responsibility_tier: "T2"
    context_sections: ["40-work-order.md#Deliverables", "10-intent.md#Problem"]
    budget_tokens: 12000

  - id: "STAGE-002"
    title: "Run the conformance battery"
    executor_kind: "service"
    responsibility_tier: "T1"
    executor_ref: "gate://ops.conformance.plants@1.0.0"
    wall_time_seconds: 1800
