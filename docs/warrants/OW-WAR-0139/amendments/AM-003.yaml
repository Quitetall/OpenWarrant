schema: "oh.war/amendment/v1"

id: "AM-003"
band: "manual_revision"
reason: "The work order's escalation rule says a dependency is added only after an amendment declares `crates/openwarrant-cli/Cargo.toml` and `Cargo.lock`, and the set does not declare them. U-002's options A and B both terminate TLS in `war`, which needs a TLS library; `--lan`, its certificate flags and `war ui devices` are clap arguments, and clap's definitions live in `crates/openwarrant-cli/src/lib.rs`, which the set does not declare either. This amendment declares the three files. It records no answer to U-001 or U-002: it was drafted on a contingent branch built against the recommendations (U-001 A; U-002 A, with B as a labelled fallback), and it is needed only if the owner chooses A or B for U-002. The dependencies it admits: `rustls =0.23.43` (features std, tls12, ring), `rustls-pki-types =1.15.1` (PEM reading) and `ring =0.17.14` (the self-signed fallback's key), all three already in Cargo.lock through ureq, so no new crate enters the build for TLS; and `qrcodegen =1.8.0` (MIT, no dependencies) for the pairing QR code the intent names — the one new crate. Wording drafted by the performer `claude`."
governing_adr_or_policy: "sas://WAR-SAS-69.4"
artifact_admissibility: "remain_admissible"
restart_or_repair_instruction: "Continue only once U-001 and U-002 are answered with the options this amendment presumes; otherwise withdraw it. The deliverable set gains D-008 `crates/openwarrant-cli/Cargo.toml`, D-009 `Cargo.lock` and D-010 `crates/openwarrant-cli/src/lib.rs` (the `war ui` flags and the `devices` subcommand only). The next revision is authorized against the amended contract."
re_preflight_required: "false"
authorizer: "Brian Lam"
effective_time: "2026-09-25"

semantic_diff:
  - element: "deliverables"
    before: "D-001..D-007; Cargo.toml, Cargo.lock and lib.rs undeclared."
    after: "Also D-008 crates/openwarrant-cli/Cargo.toml and D-009 Cargo.lock (rustls, rustls-pki-types, ring, qrcodegen, exact pins), and D-010 crates/openwarrant-cli/src/lib.rs (`war ui --lan/--name/--cert/--key/--self-signed` and `war ui devices [--revoke]`)."

