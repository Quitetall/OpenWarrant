obligation = "OBL-003"
disposition = "refuted"
evidence = "The obligation requires optimistic concurrency and idempotency per §67.3/§67.4, evidenced by 'a stale write refused; a duplicated action applied once.' D-001's ActionEnvelope struct (crates/openwarrant-cli/src/kf.rs) carries only target_ids, payload, reason, and idempotency_key — there is no concurrency token, version, or ETag field anywhere in the envelope or in Client::post_action's headers (x-kf-actor, x-kf-acting-role, x-kf-organization only), even though 40-work-order.md's Deliverables item 2 explicitly calls for 'the action envelope with concurrency token and idempotency key.' None of the three tests in D-001 (an_https_url_is_accepted, a_non_http_url_is_refused, a_short_idempotency_key_never_reaches_the_network) exercises a stale write or a duplicate retry; the only idempotency-related check is a client-side string-length guard on the key, not dedup behavior. Since this is the only deliverable carried for the warrant and it visibly lacks any concurrency mechanism required by the frozen envelope surface, the bundle affirmatively shows the concurrency half of the claim does not hold."
performer = "claude"

[verifier]
actor = "claude-verifier (claude-sonnet-5)"
kind = "agent"

[verifier.independence]
performer_transcript_blind = true
performer_rationale_blind = true
separate_writable_workspace = true
cannot_modify_subject_artifacts = true
cannot_modify_gate_definition = true
cannot_modify_gate_fixtures = true
separate_context_compilation = true
distinct_model_required = true
distinct_human_required = false
