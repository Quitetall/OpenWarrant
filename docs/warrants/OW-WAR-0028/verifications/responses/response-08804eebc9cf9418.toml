schema = "oh.war/verification-response/v1"
warrant = "OW-WAR-0028"

[[verifications]]
obligation = "OBL-001"
disposition = "not_established"
evidence = "D-001 (crates/openwarrant-cli/src/kf.rs) shows a typed ActionEnvelope struct and a single write method Client::post_action that requires one, alongside a read-only health() call — structurally suggestive of 'typed and enveloped' actions for this file. But the obligation's own evidence bar is 'every state change goes through an action,' a system-wide claim, and the bundle carries only this one deliverable with no test asserting that no other write path exists anywhere in the codebase; the three named tests (an_https_url_is_accepted, a_non_http_url_is_refused, a_short_idempotency_key_never_reaches_the_network) test URL scheme and idempotency-key length only. The gate run GR-software.repo.war-check@1.0.0's own NOT CHECKED section states '`war check` does not invoke [war gate --run], so nothing here is evidence that a Warrant's acceptance gates were run,' so that run is not functional evidence about kf.rs. Absent an executed test or plant demonstrating the universal claim, this is not established from the bundle."
performer = "claude"
[verifications.verifier]
actor = "claude-verifier (claude-sonnet-5)"
kind = "agent"
