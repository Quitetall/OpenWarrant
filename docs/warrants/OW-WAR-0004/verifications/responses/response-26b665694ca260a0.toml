[[verifications]]
obligation = "OBL-001"
disposition = "not_established"
evidence = "obligation_evidence explicitly marks the named path 'docs/warrants/' as not carried, so no generated WAR.md/WAR.json bytes for any of the five Warrants are in the bundle. The carried deliverables are only compiler source (D-001 render.rs, D-002 compile.rs), not executed-test or rendered-file evidence. The one gate run, GR-software.repo.war-check@1.0.0, has truncated stdout; the sole excerpt naming a Warrant's drift status (lines 81-101) shows 'PASS generated.drift OW-WAR-0004: 2 generated view(s) match a fresh compilation' — evidence only for OW-WAR-0004, not the other four Warrants the obligation's scope names. Absent that coverage, the claim cannot be established for its stated scope."
performer = "claude"
[verifications.verifier]
actor = "claude-verifier (claude-sonnet-5)"
kind = "agent"
