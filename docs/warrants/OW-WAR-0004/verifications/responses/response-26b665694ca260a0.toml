disposition = "established"
evidence = "Gate run GR-software.repo.war-check@1.0.0 (verdict: pass) has a visible excerpt (stdout lines 81-101) containing the line 'PASS generated.drift OW-WAR-0004: 2 generated view(s) match a fresh compilation'. Per atoms/20-basis.md, the drift check works by comparing the committed generated views against a fresh compilation from the same Basis, which is exactly the property OBL-002 states (recompiling an unmodified tree produces no change): the committed files, product of an earlier compile, matched a newly performed compile byte-for-byte. This is a recorded, executed-gate result (not merely source code) and is not contradicted by the evidence.stale-binding WARN in the same excerpt, which flags staleness only in paths 'outside the evidence records, projections, authority records, verification records and ticket bookkeeping' — i.e. explicitly not the projections this obligation concerns."
performer = "claude"
