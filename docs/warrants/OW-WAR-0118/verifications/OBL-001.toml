evidence = "The obligation's scope ties the claim to measure.sh 'run by 50-friction.sh on a scratch directory', but the only gate run in the bundle (GR-ops.conformance.plants@1.1.0) has its stdout marked truncated:true, and obligation_evidence explicitly lists the term 'not_measured' as cut_from that stdout; independently, the visible tail of that stdout (ending '1214 passed, 0 failed / tested commit 39d30f3d...') contains no '== friction measurement (OW-WAR-0118) ==' section or any of the plant's own lines ('every step timed or counted', 'a timed human step is refused'). D-002 (docs/friction/baseline-1.json) does show, as a real artifact, every setup/program step either as an integer median_ms/max_ms (tool) or 'time': 'not_measured' (human, e.g. human-say-who-may-sign, human-accept-sas, human-authorize-first-warrant, human-confirm-routine-signature) with no zero or number on any human row, which supports the structural claim, but the obligation's load-bearing sub-requirement — the plant refusing a doctored record with a numeric/zero human-step time — has no confirmed execution trace anywhere in the bundle, so the obligation as a whole is not established."
