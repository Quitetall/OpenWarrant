reason: "OBL-001, OBL-002 and OBL-003 cite gate://software.repo.war-check@1.0.0, a static `war check` that runs no gate and no plant; its own output says so ('nothing here is evidence that a Warrant's acceptance gates were run'). The evidence each obligation names is a run of conformance/plants.d/48-isolated-battery.sh (D-003): the isolated gate on a scratch corpus with a fake battery (OBL-001), plant-isolated.sh under OPENWARRANT_IN_BATTERY=1 (OBL-002), and the registration and @1.0.0's bytes (OBL-003). The blind verifier found all three not established because the cited gate's receipt carries none of it. This amendment cites the gate that runs that plant. OBL-003's plant also gains the two points it did not assert: @1.0.0 byte-identical to its bytes before the commit that added @1.1.0, and `war check` reporting no error, each with a refusal. Nothing is narrowed. Wording drafted by the performer `claude`."
