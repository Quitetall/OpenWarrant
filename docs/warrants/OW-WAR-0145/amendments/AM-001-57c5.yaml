artifact_admissibility: "remain_admissible"
restart_or_repair_instruction: "Continue. D-003 (48-isolated-battery.sh) gains the OBL-003 assertions. 60-assurance.md carries the amended text as revision 2 (it cites gate://ops.conformance.plants@1.1.0 on OBL-001..003), the contract digest moves, the signature authorizes that revision, and the battery is recorded with `war evidence record OW-WAR-0145`."
