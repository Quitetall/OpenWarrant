evidence = "D-006 (telemetry.rs, not truncated) shows adoption_baseline is Option<String> skipped when unset, history_read() returns \"all history (no [adoption] baseline)\" when config.adoption is None, and untracked_candidates() runs unbounded `git log` when no [adoption] entry exists. Directly confirming this on the actual repository, the gate run GR-ops.conformance.plants@1.1.0 (verdict pass, 1260 passed/0 failed) stdout excerpt lines 716-742 includes the line \"ok this repository reads all history 673 candidates, recounted from git log; no adoption_baseline\" — an executed plant that recomputes the count independently from git log and confirms no adoption_baseline is written, matching the obligation's exact evidence requirement. The refusal condition (a bounded count where [adoption] exists) is shown by the adjacent OBL-002 plant lines in the same run, e.g. \"0 candidates right after init ... read from 68ed7543...HEAD\" and \"one uncited commit is 1 candidate\", demonstrating the contrast the obligation asks for. obligation_evidence for OBL-005 confirms the terms '[adoption]', 'adoption_baseline', 'git log' and 'war telemetry' are all shown in both D-006 and the ops.conformance.plants stdout, with no cut_from truncation."
