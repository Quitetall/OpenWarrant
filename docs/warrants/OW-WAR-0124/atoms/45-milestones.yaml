schema: "oh.war/milestones/v1"

milestones:
  - id: "M1"
    title: "A baseline recorded at init, and untracked work counted from it in the repository's namespace"
    stage_refs: ["STAGE-001"]
    obligation_refs: ["OBL-001", "OBL-002", "OBL-003", "OBL-005"]
  - id: "M2"
    title: "The guided Baseline step, the ADR pointer, and ADOPTING.md"
    depends_on: ["M1"]
    stage_refs: ["STAGE-002"]
    obligation_refs: ["OBL-004", "OBL-006"]

  - id: "MB"
    title: "The battery, run as the gate these obligations cite"
    depends_on: ["M1", "M2"]
    stage_refs: ["STAGE-003"]
    obligation_refs: ["OBL-001", "OBL-002", "OBL-003", "OBL-004"]

stages:
  - id: "STAGE-001"
    title: "config.rs [adoption], init --baseline, the adopt template, telemetry.rs, and 59-adoption.sh's scripted plants"
    executor_kind: "agent"
    executor_ref: "agent://claude-code"
    responsibility_tier: "T2"
    context_sections: ["40-work-order.md#Deliverables", "20-basis.md#What the code does today (read 2026-09-23)"]
    budget_tokens: 12000
  - id: "STAGE-002"
    title: "guided.rs Baseline step, the war migrate pointer, docs/ADOPTING.md"
    executor_kind: "agent"
    executor_ref: "agent://claude-code"
    responsibility_tier: "T2"
    context_sections: ["40-work-order.md#Deliverables", "40-work-order.md#Frozen Surfaces"]
    budget_tokens: 10000

  - id: "STAGE-003"
    title: "Run the conformance battery"
    executor_kind: "service"
    responsibility_tier: "T1"
    executor_ref: "gate://ops.conformance.plants@1.0.0"
    wall_time_seconds: 1800
