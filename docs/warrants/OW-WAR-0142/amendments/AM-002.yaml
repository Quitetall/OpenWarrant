reason: "Building M2-M4 against the recommended answers (Q-001 A, Q-002 as drafted, Q-003 refuse) reached eleven files outside the signed set, each the smallest change a declared item needs: (1) authority_check.rs, because every reader of an authorization asks it whether a human signed, and a covered record is signed through its class, so the two class acts (Act::AcceptStanding, Act::RevokeStanding) and the covered verdict belong there; (2) attest.rs, because a class act's attestation belongs to no Warrant and `attest --all --verify` must read it; (3) resolution_cmd.rs, because the policy service's resolution is ingested there and item 11's refusal (resolve.standing-needs-human) must stop it; (4) next.rs and console.rs, whose exhaustive matches on Pending must name item 9's two new acts; (5) mcp/tools.rs and mcp/mod.rs, because the Premade Instructions say `war mcp --describe` lists standing apply and show and refuses standing propose --ingest; (6) schemas.rs, schemas/typescript/standing-authorization.ts and schemas/typescript/manifest.json, because item 5's schema and pack are generated from the types and drift-checked with their TypeScript projection; (7) docs/sas/revisions/1.2.0.toml, the record item 2's `war sas propose 1.2.0` writes. Wording drafted by the performer `claude`."
