obligation = "OBL-004"
disposition = "refuted"
evidence = """OBL-004's evidence explicitly requires 'the ADR is status: accepted'. The ADR atom (path ../../adr/atoms/OW-ADR-0019-sas-1-1-0-batch-act-and-renderings.md, sha256 dbed46acc...) is carried in full: its frontmatter reads 'status: proposed' and its body's Status section states 'Proposed. Accepted when the repository owner signs SAS revision 1.1.0 (§101.3 requires this ADR for an architecture-changing revision, and the revision is not accepted until that signature exists).' This directly contradicts the accepted-status requirement. The ADR does correctly list 'governs: - "war://01a0983e-32d7-7473-b6e1-fbef061a1e5f"' matching this Warrant's UUID (also confirmed by the gate run excerpt 'PASS identity.atom-mismatch OW-WAR-0071: 3 atom(s) name this Warrant's UUID'), and it does state the rejected alternatives (dropping ssh-add -c, per-act signing, a time-boxed session, a tool-held key) with reasons under 'Why not the alternatives.' But because the bundle's own carried text shows the required accepted-status condition to be false, the obligation is refuted rather than merely unestablished."""
performer = "claude"

[verifier]
actor = "claude-verifier (claude-sonnet-5)"
kind = "agent"

[verifier.independence]
performer_transcript_blind = true
performer_rationale_blind = true
separate_writable_workspace = true
cannot_modify_subject_artifacts = true
cannot_modify_gate_definition = true
cannot_modify_gate_fixtures = true
separate_context_compilation = true
distinct_model_required = true
distinct_human_required = false
