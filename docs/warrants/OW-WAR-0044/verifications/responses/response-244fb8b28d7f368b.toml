[[verifications]]
obligation = "OBL-001"
disposition = "refuted"
evidence = "atoms/60-assurance.md's JDG-001 explicitly holds OBL-001 undischarged ('held, not narrowed: nothing about the obligations has changed'), and OBS-007 documents why: 'war kf act with --confirm-write reached the server and was answered 404 for an unregistered action type... no §67 action can be recorded in this instance until KF's ontology registry is seeded.' This is affirmative evidence that the instance did NOT successfully answer a typed action with a recorded envelope and server-assigned receipt — the specific evidence OBL-001 requires. Only EV-001 (a read-only `war kf health` call) succeeded; D-001's tests (an_https_url_is_accepted, a_non_http_url_is_refused, a_short_idempotency_key_never_reaches_the_network) exercise no live write either. No action envelope or receipt appears anywhere in the bundle."
