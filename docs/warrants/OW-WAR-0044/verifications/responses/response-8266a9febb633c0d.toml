[[verifications]]
obligation = "OBL-001"
disposition = "not_established"
evidence = "atoms/60-assurance.md's JDG-001 states OBL-001 requires a recorded action envelope with a server-assigned recorded_at via a real WRITE to KF, and explicitly holds it undischarged ('held, not narrowed: nothing about the obligations has changed'). The only concrete server interaction shown is EV-001 (a read-only `war kf health` call) and OBS-007 (`war kf act --confirm-write` reached the server but got a 404 because `core.action` has no registered action types, and the type used was deliberately invalid for diagnosis). No recorded action envelope or receipt exists anywhere in the bundle, and D-001 (kf.rs)'s own tests (an_https_url_is_accepted, a_non_http_url_is_refused, a_short_idempotency_key_never_reaches_the_network) never exercise a live write. The prior verification for OBL-001 cites a receipt file and a test 'seam::tests::a_client_cannot_assign_recorded_at' that appear nowhere in this bundle and are not corroborated by it."
performer = "claude"
