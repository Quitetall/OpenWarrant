disposition = "refuted"
evidence = "atoms/60-assurance.md's JDG-001 states OBL-001 is 'held, not narrowed' and that the write 'stopped at KF's own registry, which answers 404 for an unregistered action type (OBS-007)' — i.e. core.action is empty and no §67 action could be recorded in this instance. OBS-007 documents the write attempt against the live instance reaching a 404, not a recorded envelope/receipt. EV-001 (war kf health) is read-only and D-001's three tests (an_https_url_is_accepted, a_non_http_url_is_refused, a_short_idempotency_key_never_reaches_the_network) never perform a live write either. The bundle affirmatively shows the required recorded action envelope and receipt never came into existence, so the claim is shown false rather than merely unproven."
