schema = "oh.war/verification-response/v1"
warrant = "OW-WAR-0023"

[[verifications]]
obligation = "OBL-001"
disposition = "not_established"
evidence = "OBL-001's evidence bar requires a compiled Dispatch shown 'readable and complete with the repository absent — tested by moving it, not by inspection.' The only deliverable carried (D-001, crates/openwarrant-core/src/execution.rs) contains only in-process tests — every_section_47_1_field_is_present_by_name, refs_and_api_version_are_required, and a_dispatch_round_trips_through_json — which inspect a StageDispatch value or its serde_json round-trip within the same test binary; none relocates a compiled Dispatch artifact outside the repository and reads it standalone as the obligation specifically demands. The single gate run GR-software.repo.war-check@1.0.0 invokes `war check --generated`, a repo-consistency/structure checker whose own excerpted stdout notes 'war check does not invoke [gates]', so it is not evidence of any such move-and-read test being executed. The assurance atom's own Residual Risk section further states 'Dispatch completeness is argued rather than demonstrated,' which is consistent with the bundle showing no demonstration meeting the stated evidence bar."
performer = "claude"
[verifications.verifier]
actor = "claude-verifier (claude-sonnet-5)"
kind = "agent"
[verifications.verifier.independence]
