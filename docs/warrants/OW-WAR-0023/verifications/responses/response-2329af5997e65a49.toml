[[verifications]]
obligation = "OBL-003"
disposition = "not_established"
evidence = "OBL-003 requires 'a plant requesting an unlisted capability, refused,' but the bundle's top-level plants array is empty, so no such conformance plant is carried. D-001's test_names list contains no test exercising capability denial, and the CapabilityAuthorization struct defined in execution.rs carries only policy_ref and digest with no enforcement/default-deny logic anywhere in the deliverable's text. The assurance atom's 'Executed attacks' list (atoms/60-assurance.md) enumerates attacks on contract_digest/revision/obligation_refs tampering, omitted_subgraphs, and repair evidence, but names nothing about an unlisted-capability request being refused. The single gate run's excerpted stdout concerns unrelated repo-structure checks (manifest, deliverable digests, traceability, journal), giving no evidence of this specific refusal."
