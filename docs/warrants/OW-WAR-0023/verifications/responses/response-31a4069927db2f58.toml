[[verifications]]
obligation = "OBL-002"
disposition = "established"
evidence = "OBL-001's evidence requirement is explicit: a compiled Dispatch must be shown readable and complete with the repository absent, tested by moving it, not by inspection. The only deliverable carried, D-001 (crates/openwarrant-core/src/execution.rs), contains tests every_section_47_1_field_is_present_by_name, refs_and_api_version_are_required, and a_dispatch_round_trips_through_json, all of which inspect a StageDispatch value or its serialized JSON in-process — none relocates a compiled Dispatch away from the repository and reads it standalone. The single gate run (GR-software.repo.war-check@1.0.0) invokes `war check --generated`, a repo-consistency checker, and its own truncated stdout notes 'war check does not invoke [gates]' — it is not evidence of this test being executed. This matches the prior verification by lamu:mimo-v2.5-pro, which reached not_established for the identical reason."
performer = "claude"
