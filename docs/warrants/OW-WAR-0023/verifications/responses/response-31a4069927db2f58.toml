[[verifications]]
obligation = "OBL-003"
disposition = "not_established"
evidence = "OBL-003 requires a plant requesting an unlisted capability that is refused. The bundle's plants array is empty ([]), and no test in D-001's test_names list exercises capability denial — CapabilityAuthorization in execution.rs only carries policy_ref/digest fields with no default-deny enforcement logic visible in this file. The assurance atom's 'Executed attacks' section lists attacks on contract_digest, contract_revision, obligation_refs, omitted_subgraphs, and repair evidence, but names no attack planting an unlisted-capability request. This matches the prior verification by lamu:mimo-v2.5-pro, which found no plant or test covering this control."
