schema = "oh.war/verification-response/v1"
warrant = "OW-WAR-0123"

[[verifications]]
obligation = "OBL-006"
disposition = "not_established"
evidence = "The gate://software.repo.war-check@1.0.0 run (GR-software.repo.war-check@1.0.0, tree:2b24c062778e0d87732c7f85873cd25ceb8fbad3, matching the authorized contract) does show, in its stdout excerpts at lines 57, 77, 96 and 120, exactly one WARN relations.parent-revision each for OW-WAR-0002, OW-WAR-0003, OW-WAR-0004 and OW-WAR-0005, each naming revision 2 and wording matching U-001 option (b) (signed child, amendment path) — this part of the claim is supported. But OBL-006 also requires that the report 'reports no parent finding for any other Warrant' across the whole corpus (the tail excerpt reports 2046 pass · 231 warn · 0 unknown · 0 error and 'NOT CHECKED: 143 of 143 Warrant(s) have no disposed obligations', implying a large corpus), and the stdout object is truncated:true with only a handful of excerpted line ranges out of ~2790 lines; no excerpt or summary line confirms the absence of any other relations.parent-revision or relations.parent-digest finding elsewhere in the corpus. Per the bundle's own rules, bytes not shown are not evidence either way, so the universal-absence half of OBL-006's evidence cannot be verified from what is carried, leaving the obligation not established."
performer = "claude"
[verifications.verifier]
actor = "claude-verifier (claude-sonnet-5)"
kind = "agent"
[verifications.verifier.independence]
performer_transcript_blind = true
