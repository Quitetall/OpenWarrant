evidence = "D-004 (conformance/plants.d/58-parent-revision.sh) contains the OBL-001 block that resets the corpus, cites OW-WAR-0001 at revision 7 via pr_cite, runs `war check OW-WAR-0002`, and asserts (pr_expect) exactly one error-severity `relations.parent-revision` diagnostic naming both 'revision 7, which does not exist' and 'latest authorized revision is 2', asserts nonzero exit, and asserts no pass under that rule. The gate run GR-ops.conformance.plants@1.1.0 (verdict: pass, subject_digests including contract:sha256:2633499a… matching authorized_contract_digest) stdout excerpt lines 647-698 show these exact plant lines succeeding: 'ok    revision 7 refused                 error relations.parent-revision ×1', 'ok    revision 7 exits non-zero          exit 2', 'ok    revision 7 is not passed           no pass relations.parent-revision'. D-001 (check.rs, excerpt ending line 2314-2385) shows the corresponding implementation: `if r == 0 || r > latest { report.push(Diagnostic::error(\"relations.parent-revision\", ... \"is cited at revision {r}, which does not exist: its latest authorized revision is {latest}\"))}`. Together the code, the named plant, and the passing gate run establish the obligation within its stated scope (OW-WAR-0002, in-repository parent)."
