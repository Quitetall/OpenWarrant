[[verifications]]
obligation = "OBL-001"
disposition = "established"
evidence = "D-004 (conformance/plants.d/58-parent-revision.sh, untruncated, 307 lines) contains the OBL-001 block: it resets the full clone, calls pr_cite to set OW-WAR-0002's citation to revision 7 at OW-WAR-0001's revision-2 digest, runs `war check OW-WAR-0002`, and asserts via pr_expect exactly one error-severity `relations.parent-revision` diagnostic containing 'revision 7, which does not exist' and 'latest authorized revision is 2', a nonzero exit, and no pass under that rule. Gate run GR-ops.conformance.plants@1.1.0 (verdict: pass, subject_digests contract sha256:0f0e0739… tree e54ccac1…, receipt_digest sha256:02b17786…) stdout excerpt (lines 664-715) shows these exact plant assertions succeeding: 'ok    revision 7 refused                 error relations.parent-revision ×1', 'ok    revision 7 exits non-zero          exit 2', 'ok    revision 7 is not passed           no pass relations.parent-revision'. D-001 (check.rs, excerpt lines 2314-2385) shows the matching implementation: `if r == 0 || r > latest { report.push(Diagnostic::error(\"relations.parent-revision\", ..., \"is cited at revision {r}, which does not exist: its latest authorized revision is {latest}\")); continue; }`. The obligation_evidence entry for OBL-001 confirms `58-parent-revision.sh` and `[[parents]]`/`war check`/`relations.parent-revision` are all shown, not cut. This is within the obligation's stated scope (OW-WAR-0002, an in-repository parent, exercised by this named plant), so the claim is established."
performer = "claude"
