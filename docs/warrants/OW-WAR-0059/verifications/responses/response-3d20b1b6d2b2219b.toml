schema = "oh.war/verification-response/v1"
warrant = "OW-WAR-0059"

[[verifications]]
obligation = "OBL-002"
disposition = "not_established"
evidence = "D-001 (evidence.rs) is the only deliverable carried for OBL-002, and it does show the unit test `a_receipt_for_an_earlier_contract_is_a_record_not_evidence`, which binds a receipt to `contract:sha256:ffff` while the contract is `C` and confirms `admissible_runs` returns empty with the error containing 'earlier revision' — this satisfies the first half of the obligation's stated evidence ('a unit test binds a receipt to another digest and admissible_runs returns nothing'). The second half requires 'a plant edits an atom of a Warrant with recorded evidence and war resolve --dry-run reports requirement 5 unmet again, while war check reports evidence.stale-binding'. The bundle's plants array is empty ([]), and obligation_evidence explicitly lists the term 'war resolve --dry-run' with shown_in: [] — meaning that command's output is absent from the bundle entirely. The evidence.stale-binding lines visible in the software.repo.war-check@1.0.0 stdout excerpts (e.g. for OW-WAR-0112, OW-WAR-0116, OW-WAR-0123, OW-WAR-0133, OW-WAR-0145) do show real contract-digest mismatches producing evidence.stale-binding in `war check`, but they are ordinary corpus state from a full gate run, not a plant constructed and executed specifically to test this obligation, and none of them is paired with a `war resolve --dry-run` showing requirement 5 flipping back to unmet. Since a material part of the obligation's named evidence (the plant and the war resolve --dry-run output) is not carried in the bundle, the claim cannot be established from what is shown, and nothing in the bundle refutes it either."
performer = "claude"
[verifications.verifier]
actor = "claude-verifier (claude-sonnet-5)"
kind = "agent"
[verifications.verifier.independence]
performer_transcript_blind = true
performer_rationale_blind = true
separate_writable_workspace = true
cannot_modify_subject_artifacts = true
cannot_modify_gate_definition = true
cannot_modify_gate_fixtures = true
separate_context_compilation = true
distinct_model_required = true
distinct_human_required = false
