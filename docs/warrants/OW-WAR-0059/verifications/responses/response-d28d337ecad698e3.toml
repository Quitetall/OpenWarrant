schema = "oh.war/verification-response/v1"
warrant = "OW-WAR-0059"

[[verifications]]
obligation = "OBL-002"
disposition = "not_established"
evidence = "The bundle carries only D-001 (evidence.rs) for OBL-002 and plants is empty ([]). The unit test 'a_receipt_for_an_earlier_contract_is_a_record_not_evidence' in D-001 is shown in full and does demonstrate that admissible_runs returns empty for a receipt bound to a different contract digest (contract:sha256:ffff vs C), satisfying the first half of the obligation's stated evidence. However, the obligation's evidence also requires 'a plant edits an atom of a Warrant with recorded evidence and war resolve --dry-run reports requirement 5 unmet again, while war check reports evidence.stale-binding'. obligation_evidence explicitly lists the term 'war resolve --dry-run' with shown_in: [] — it is not shown anywhere in the bundle — and no plant records appear in the plants array. The evidence.stale-binding lines visible in the software.repo.war-check@1.0.0 stdout excerpts (e.g. for OW-WAR-0063, OW-WAR-0127, OW-WAR-0133) concern a moved tree/source (the OW-WAR-0133 reuse rule), not a plant demonstrating a contract-digest mismatch via war resolve --dry-run, so they do not substitute for the missing evidence. A prior verification by lamu:mimo-v2.5-pro disposed this 'established' citing only the unit test, but its cited evidence likewise does not address the plant/war-resolve requirement, so it cannot be relied on to fill the gap. Because half of the obligation's named evidence is absent from what was carried, this cannot be established from the bundle alone, nor is there anything showing it false, so it is not_established."
performer = "claude"
[verifications.verifier]
actor = "claude-verifier (claude-sonnet-5)"
kind = "agent"
[verifications.verifier.independence]
performer_transcript_blind = true
performer_rationale_blind = true
separate_writable_workspace = true
cannot_modify_subject_artifacts = true
cannot_modify_gate_definition = true
cannot_modify_gate_fixtures = true
separate_context_compilation = true
distinct_model_required = true
distinct_human_required = false
