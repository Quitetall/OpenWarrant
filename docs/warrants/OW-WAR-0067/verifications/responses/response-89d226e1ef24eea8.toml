[[verifications]]
obligation = "OBL-001"
disposition = "refuted"
evidence = "The bundle's only conformance plant (conformance/plants.d/90-skills.sh:9) names OW-WAR-0067 STAGE-001 directly and asserts its status is 'OPEN' — atoms/45-milestones.yaml maps STAGE-001 ('Relicense to Apache-2.0') to milestone M1/OBL-001, so an OPEN (unblocked-but-undone) stage means the relicense act has not occurred, contradicting the claim that 'the tree is relicensed.' This is corroborated by obligation_evidence for OBL-001: Cargo.toml is marked 'not carried' (not even a deliverable of this Warrant per the bundle), LICENSE/NOTICE/allowed_signers appear only as text inside the atoms (never as actual file bytes — deliverables is empty), and both required gate outputs ('cargo xtask gate' spdx/licences steps and 'war attest --all') have shown_in: [] — nowhere present in the bundle. The gate run GR-software.repo.war-check@1.0.0 also does not run acceptance gates itself ('war check does not invoke it'), so it cannot substitute as the required evidence."
performer = "claude"
[verifications.verifier]
actor = "claude-verifier (claude-sonnet-5)"
kind = "agent"
