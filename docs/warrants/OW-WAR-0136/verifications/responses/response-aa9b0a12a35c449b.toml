[[verifications]]
obligation = "OBL-001"
disposition = "established"
evidence = "The gate run GR-ops.conformance.plants@1.1.0 (gate://ops.conformance.plants@1.1.0, receipt verdict 'pass') is the gate OBL-001 names, and its stdout excerpt from conformance/plants.d/58-invalidation.sh (D-007) contains the four lines that decide the three evidence bullets verbatim: 'ok receipts are attestation subjects receipt, run, stdout, stderr each at its digest on disk' (bullet 1), 'ok a replaced receipt fails --verify attest.subject-drift names docs/warrants/IV-WAR-0002/gate-runs/plant_g_1_0_0.receipt.json (exit 2)' and 'ok a replaced receipt fails --custody attest.custody-drift names ... (exit 2)' (bullet 2, both commands fail and name the file), and 'ok untouched, verify and custody pass attest.verified, attest.custody-audited (exit 0, 0)' (bullet 3, control). D-007's own excerpted source (lines 237-271) shows the underlying check: a Python script recomputing sha256 for every gate_run_refs receipt plus its .run.toml, stdout_ref and stderr_ref and comparing against the resolve attestation's subject digests read from disk rather than from the tool, on the IV scratch corpus built with a throwaway ssh-agent/test key per the script's header, matching OBL-001's stated scope and excluding the 29 existing resolutions (Basis A-004). D-002 (sign.rs) and D-003 (attest.rs) excerpts show the code paths that add gate_run_refs files as attestation subjects and that raise attest.custody-drift on a moved subject, corroborating the mechanism the plant exercises. obligation_evidence lists the deciding terms (war sign --ssh-sign, gate_run_refs, war attest --verify, war attest --custody) all with cut_from: [], meaning none of the evidence needed was cut by the budget."
performer = "claude"
[verifications.verifier]
