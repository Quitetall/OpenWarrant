schema: "oh.war/milestones/v1"

milestones:
  - id: "M1"
    title: "Custody audited: receipts are attestation subjects, war attest --custody"
    stage_refs: ["STAGE-001"]
    obligation_refs: ["OBL-001", "OBL-002"]
  - id: "M2"
    title: "One invalidation disputes every dependent resolution, and nobody who did the work acts"
    depends_on: ["M1"]
    stage_refs: ["STAGE-002"]
    obligation_refs: ["OBL-003", "OBL-004", "OBL-005"]
  - id: "M3"
    title: "The exit demonstrated in this repository (Q-002 b only)"
    depends_on: ["M2"]
    stage_refs: ["STAGE-003"]
    obligation_refs: ["OBL-006"]

  - id: "MB"
    title: "The battery, run as the gate these obligations cite"
    depends_on: ["M1", "M2", "M3"]
    stage_refs: ["STAGE-004"]
    obligation_refs: ["OBL-001", "OBL-002", "OBL-003", "OBL-004", "OBL-005"]

stages:
  - id: "STAGE-001"
    title: "sign.rs receipt subjects, attest.rs --custody, custody-audit record, plants"
    executor_kind: "agent"
    executor_ref: "agent://claude-code"
    responsibility_tier: "T2"
    context_sections: ["40-work-order.md#Deliverables", "20-basis.md#Assumptions"]
    budget_tokens: 12000
  - id: "STAGE-002"
    title: "invalidation.rs, the act per Q-001, dispute records, resolution.disputed, 58-invalidation.sh, INVALIDATION.md"
    executor_kind: "agent"
    executor_ref: "agent://claude-code"
    responsibility_tier: "T2"
    context_sections: ["40-work-order.md#Deliverables", "20-basis.md#Unknowns"]
    budget_tokens: 18000
  - id: "STAGE-003"
    title: "The owner signs the demo resolution and the invalidation; the auditor records custody"
    executor_kind: "human"
    responsibility_tier: "T2"

  - id: "STAGE-004"
    title: "Run the conformance battery"
    executor_kind: "service"
    responsibility_tier: "T1"
    executor_ref: "gate://ops.conformance.plants@1.0.0"
    wall_time_seconds: 1800
