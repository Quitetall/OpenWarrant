evidence = "D-002's `measures` object gives every entry either `{value, method}` or `{not_measurable_yet, reason}` with no exceptions (e.g. `auto-authorizable fraction` is `value: 0` but its method explicitly states 'and MEASURED zero — §56.1 requirement 10 is unmet ... so none is auto-authorizable', i.e. a stated real zero, not an untaken one). D-001's `unmeasurable()` function and its module-doc corroborate that unmeasurable measures are deliberately non-zero-coded. Since D-002 is present in full (truncated: false), this can be checked directly against every measure without relying on the cited unit test."
performer = "claude"
