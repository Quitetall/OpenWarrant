obligation = "OBL-002"
disposition = "established"
evidence = """Direct inspection of the full, untruncated D-002 shows every measure that names a property of an instrumented authoring session (clarification count, compute and model cost, context tokens per dispatch/verification, escalation count and class, gate failure cause, human authoring minutes, interview questions, post-resolution escapes, reopenings, replay/repair/restart, time to first usable artifact, wall time) is recorded as {"not_measurable_yet": "<reason>"}, never as a bare 0. The single 0-valued measure, 'auto-authorizable fraction', carries a method string explicitly stating it is a genuine measured zero ('§56.1 requirement 10 is unmet for every Warrant, so none is auto-authorizable'), matching D-001's unmeasurable()/module-doc distinction between an untaken measure and a real zero. No entry in the artifact has neither field, satisfying the obligation's 'grep for = 0' evidence criterion."""
performer = "claude"

[verifier]
actor = "claude-verifier (claude-sonnet-5)"
kind = "agent"

[verifier.independence]
performer_transcript_blind = true
performer_rationale_blind = true
separate_writable_workspace = true
cannot_modify_subject_artifacts = true
cannot_modify_gate_definition = true
cannot_modify_gate_fixtures = true
separate_context_compilation = true
distinct_model_required = true
distinct_human_required = false
