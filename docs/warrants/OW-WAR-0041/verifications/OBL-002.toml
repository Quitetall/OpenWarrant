obligation = "OBL-002"
disposition = "established"
evidence = """Direct inspection of the untruncated D-002 shows every measure requiring instrumented authoring (clarification count, compute and model cost, context tokens per dispatch/verification, escalation count and class, gate failure cause, human authoring minutes, interview questions, post-resolution escapes, reopenings, replay/repair/restart, time to first usable artifact, wall time) is recorded as {"not_measurable_yet": "<reason>"}, never as a bare 0. The one 0-valued measure, 'auto-authorizable fraction', carries a method string stating it is a deliberate measured zero ('§56.1 requirement 10 is unmet for every Warrant, so none is auto-authorizable'), matching D-001's `unmeasurable()`/module-doc distinction between an untaken measure and a real zero. No measure in the artifact has neither field."""
performer = "claude"

[verifier]
actor = "claude-verifier (claude-sonnet-5)"
kind = "agent"

[verifier.independence]
performer_transcript_blind = true
performer_rationale_blind = true
separate_writable_workspace = true
cannot_modify_subject_artifacts = true
cannot_modify_gate_definition = true
cannot_modify_gate_fixtures = true
