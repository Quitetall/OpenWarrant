obligation = "OBL-001"
disposition = "not_established"
evidence = "OBL-001 cites gate://software.repo.war-check@1.0.0 as its evidence source, and the bundle's sole gate_runs entry is exactly that gate for OW-WAR-0146 (run_id GR-software.repo.war-check@1.0.0). Its stdout (truncated, tail shown) is a static corpus check (manifest/digest/journal/authority checks across all Warrants) and its own 'NOT CHECKED' section states explicitly: 'gate execution — `war gate --run` executes a registered gate (§44), but `war check` does not invoke it, so nothing here is evidence that a Warrant's acceptance gates were run.' No run of `conformance/plants.d/47-bundle-output.sh` (D-002) or of bundle.rs's own `#[test]` functions is carried anywhere in gate_runs, so there is no execution evidence that a bundled gate run's stdout.text/stdout.sha256/truncated/captured behave as OBL-001 requires. D-001 and D-002 show the code and the plant's assertions exist, but code presence is not evidence of runtime behavior; per the Warrant's own intent atom (atoms/10-intent.md, Non-goals), an obligation whose cited gate does not run the tests it names stays unestablishable."
performer = "claude"

[verifier]
actor = "claude-verifier (claude-sonnet-5)"
kind = "agent"

[verifier.independence]
