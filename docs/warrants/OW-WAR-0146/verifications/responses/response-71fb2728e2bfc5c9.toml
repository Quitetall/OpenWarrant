warrant = "OW-WAR-0146"

[[verifications]]
obligation = "OBL-001"
disposition = "established"
evidence = "D-002 (conformance/plants.d/47-bundle-output.sh) contains three bo_ok/bo_fail checks that directly implement OBL-001's three evidence bullets: comparing run['stdout']['sha256'] and run['stdout']['text'] against the recorded stdout file, checking truncated=true with the whole-file digest preserved after lowering max_excerpt_bytes to 64, and checking captured=false with no 'text' key after removing the stdout file. The bundled gate run 'ops.conformance.plants@1.1.0' (run_id GR-ops.conformance.plants@1.1.0, receipt verdict pass) carries an excerpt (lines 191-198) headed '== bundled gate output (OW-WAR-0146) ==' printing 'ok' for exactly these three checks verbatim ('the gate's stdout is in the bundle ... captured, text is the file's, digest ...', 'a long output is cut, not re-digested ... truncated at 64 bytes, whole-file digest', 'a missing output is not silence ... captured false, no text'), matching D-002's printf format precisely, confirming this is a real execution of the current D-002 bytes (sha256 0883b653...) rather than an assertion. The bundle document itself also structurally embodies the feature: its own gate_runs entries carry captured/sha256/bytes/truncated/text/excerpts fields, produced by D-001's code. No FAIL lines appear near this section."
performer = "claude"
[verifications.verifier]
actor = "claude-verifier (claude-sonnet-5)"
kind = "agent"
