[[verifications]]
obligation = "OBL-001"
disposition = "established"
evidence = "D-001 (crates/openwarrant-cli/src/show.rs) is carried in full, truncated:false, 547 lines. Its `diff()` function builds both comparison sides purely from canonical IR — reading `generated/WAR.json` as `from` and calling `openwarrant_compiler::render::canonical_json(&ir)` for a freshly-lowered `to` — and passes only these `serde_json::Value` trees into `semantic_diff`/`walk`, which recurses over JSON structure and never touches `render::render_view`'s Markdown output. Consequently two revisions differing only in rendering collapse to identical canonical JSON under this code path, and the in-file test `identical_documents_produce_no_changes` demonstrates that identical JSON documents yield an empty change list, with `diff()` then emitting `Diagnostic::pass(\"diff.identical\", ...)`. This is fully decidable from the shown source and tests within the stated scope."
performer = "claude"
