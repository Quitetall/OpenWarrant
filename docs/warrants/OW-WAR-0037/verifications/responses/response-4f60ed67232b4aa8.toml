schema = "oh.war/verification-response/v1"
warrant = "OW-WAR-0037"

[[verifications]]
obligation = "OBL-001"
disposition = "established"
evidence = "D-001 (crates/openwarrant-cli/src/show.rs) is carried in full (547 lines, sha256 9d98d02…, truncated:false), and its `diff()` function is shown to construct both comparison sides exclusively from canonical JSON — `std::fs::read_to_string(&baseline_path)` reading `generated/WAR.json` and `render::canonical_json(&ir)` from a fresh lowering — before calling `semantic_diff`, whose `walk` recursion operates only on `serde_json::Value` trees and never receives rendered Markdown. Because rendering (`render::render_view`) is a separate downstream projection of the same IR never passed into `semantic_diff`, a revision pair differing only in rendering reduces, under this shown code path, to two identical canonical-JSON documents; the in-bundle test `identical_documents_produce_no_changes` confirms such identical inputs yield an empty change list, and `diff()` emits `diagnostic::pass(\"diff.identical\", ...)` in that case. This is decidable from the fully-shown source alone, within the stated scope."
performer = "claude"
[verifications.verifier]
actor = "claude-verifier (claude-sonnet-5)"
kind = "agent"
[verifications.verifier.independence]
performer_transcript_blind = true
performer_rationale_blind = true
separate_writable_workspace = true
cannot_modify_subject_artifacts = true
cannot_modify_gate_definition = true
cannot_modify_gate_fixtures = true
separate_context_compilation = true
distinct_model_required = true
distinct_human_required = false

[[verifications]]
obligation = "OBL-002"
disposition = "not_established"
evidence = "D-001's `semantic_diff`/`walk` and the tests exercising them (an_added_field_is_reported, a_removed_field_is_reported, nested_changes_are_reported_by_path, array_changes_are_reported_by_index, long_values_are_truncated_but_paths_are_not) show only a generic, undifferentiated list of every path that changed between two JSON trees — nothing in `diff()` or `semantic_diff` singles out the contract digest, computes it, or identifies which one of the reported paths is the field that CAUSED the digest to move, as OBL-002 and the work-order's premade instruction ('Attribute digest movement to a field... without a cause is the report that sends people to read both versions anyway') require. The gate run stdout excerpt itself notes, in its NOT CHECKED section, that 'contract digest covers 8 of 17 §28.5 elements — missing: deliverables, capabilities, autonomy, resources, gates, obligations, rollback, amendment_policy, assurance_requirements,' meaning a generic path-diff over the full IR cannot by itself distinguish digest-affecting fields from the other 9 elements it also reports on, so it cannot constitute attribution. No deliverable, test, or gate excerpt in the bundle demonstrates the causing-field-naming behavior the obligation asks for, so the claim cannot be decided from what is shown."
performer = "claude"
[verifications.verifier]
actor = "claude-verifier (claude-sonnet-5)"
kind = "agent"
