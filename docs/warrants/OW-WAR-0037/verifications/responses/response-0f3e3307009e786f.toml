disposition = "not_established"
evidence = "The bundle shows `semantic_diff`/`walk` in show.rs reporting every changed JSON path generically (tests: an_added_field_is_reported, a_removed_field_is_reported, nested_changes_are_reported_by_path, array_changes_are_reported_by_index), but none of these tests, nor the `diff()` function itself, single out the contract digest specifically or identify which field's change is the CAUSE of a digest move — the tool only lists all differing paths, not a causal attribution to one field responsible for the digest. The gate run stdout (GR-software.repo.war-check@1.0.0) is a repo-wide `war check --generated` run and does not exercise or report on digest-attribution behavior; its own NOT CHECKED section even notes 'contract digest covers 8 of 17 §28.5 elements' without indicating any attribution mechanism. No deliverable or test in the bundle demonstrates the required causing-field naming, so the claim cannot be decided from the evidence shown."
