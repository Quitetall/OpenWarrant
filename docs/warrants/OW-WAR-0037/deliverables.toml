schema = "oh.war/deliverables/v1"

# §37.1. Declared by the performer — declaring a deliverable is a performer
# statement (§51), which is permitted. It is the VERIFICATION of the obligations
# these support that must be independent (§46), not the declaration itself.
#
# Every `content_digest` below was computed from the bytes on disk, and
# `war resolve` RECOMPUTES it rather than trusting what is written here. A digest
# that is merely present proves nothing.
#
# `contract_digest` is "unrecorded" because it is true: no authorized contract
# revision exists for this Warrant yet (§28.4 needs a human). Writing today's
# compiled digest here would assert these artifacts were produced under a
# revision nobody has authorized.

[[deliverable]]
id = "D-001"
title = "`war diff`: structural IR difference between two revisions of a Warrant, with contract-digest attribution"
kind = "file"
target_ref = "crates/openwarrant-cli/src/show.rs"
required = true
content_addressed = true
provenance_required = true
obligation_refs = ["OBL-001", "OBL-002"]

