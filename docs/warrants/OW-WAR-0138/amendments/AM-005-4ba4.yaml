schema: "oh.war/amendment/v1"

id: "AM-005-4ba4"
band: "manual_revision"
reason: "OBL-004 cites `gate://document.review@1.0.0`, whose argv is `war document review` with no alias: it reviews every Warrant in the corpus that binds to the gate. The receipt `war evidence record OW-WAR-0138` mints is bound to 0138's contract and deliverables, yet in prepare runs 3 and 4 it read FAIL on errors that were all other Warrants' (review-absent for OW-WAR-0065, 0122, 0126, 0128, 0135, 0142; undigested deliverables of 0126 and 0128), while every one of 0138's eight lines passed (D-001, D-007, D-008 digested; OBL-001..OBL-004 reviewed). `war document review OW-WAR-0138` exits 0. `document.review@1.1.0` is the same gate with argv `war document review <warrant>`, which `war evidence record` and `war run` bind to the Warrant being recorded; run for no Warrant it is not askable. This amendment moves OBL-004's citation to `@1.1.0`. Nothing else changes. Wording drafted by the performer `claude`."
governing_adr_or_policy: "sas://WAR-SAS-44.6"
artifact_admissibility: "remain_admissible"
restart_or_repair_instruction: "Continue. No artifact changes; the assurance atom's OBL-004 cites gate://document.review@1.1.0 in the revision this amendment is carried by; the signature authorizes that revision. Then `war evidence record OW-WAR-0138 --gate document.review@1.1.0`."
re_preflight_required: "false"
authorizer: "Brian Lam"
effective_time: "2026-09-27"

semantic_diff:
  - element: "gates"
    before: "OBL-004 cites gate://document.review@1.0.0 (reviews the whole corpus; its verdict is decided by other Warrants' documents)."
    after: "OBL-004 cites gate://document.review@1.1.0 (reviews OW-WAR-0138's documents only)."

