[[verifications]]
obligation = "OBL-005"
disposition = "not_established"
evidence = "The bundle's prior_verifications entry claims gate run GR-ops.conformance.plants@1.1.0's subject_digests include 'contract:sha256:c970ba32...238660 matching this bundle's authorized_contract_digest,' but the receipt actually printed in this bundle records subject_digests=['contract:sha256:018fea969160b2568321c11c209fb1ae59909e01eafffe163254b11db644426b', 'deliverables:sha256:0f6f66689c4c9254669060a57aa019a5e3c7621372dc8a77e0bbfeb02f738d5a', 'tree:e54ccac17a000db9430a08ded5ae9ad1923067b0'] — a contract digest that does not match this bundle's authorized_contract_digest (c970ba32f4716c73adbc050153db292ef5952936aa0c3ea8a39c94ab87238660) at all. The receipt's gate_binding_digest is also literally 'unbound:ops.conformance.plants@1.1.0'. Given this system's own extensively-demonstrated admissibility rules (evidence.admissible / evidence.stale-binding, as exercised throughout the battery, e.g. 't-dec1' and 't-22fd' plant blocks) require a receipt's subject contract digest to correspond to the authorized contract for its result to count as evidence for an obligation under that contract, this bundle does not establish that GR-ops.conformance.plants@1.1.0 is bound to the contract OBL-005 is scoped under. Although the gate's stdout (sha256:044e70c4b7...) does contain the three named plant lines verbatim ('the document against itself ... no section named', 'one word in §62.3 ... section 62 named (in 62.3), and no other', 'a §106 row removed ... rejected by sas.diff.removed (WAR-SAS-RQ-001)'), each with a PASS in the D-009 plant script (conformance/plants.d/56-sas-sections.sh) exercising D-008's (crates/openwarrant-cli/src/sas.rs) sections_diff logic, the unresolved contract-digest mismatch — and the prior verifier's unsupported assertion that it matches — means the bundle does not itself demonstrate this run is admissible evidence for the currently authorized contract, so the obligation cannot be established from this bundle alone."
performer = "claude"
