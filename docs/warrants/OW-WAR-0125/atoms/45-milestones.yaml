schema: "oh.war/milestones/v1"

milestones:
  - id: "M1"
    title: "Sections split losslessly, indexed, and drift-checked"
    stage_refs: ["STAGE-001"]
    obligation_refs: ["OBL-001", "OBL-002"]
  - id: "M2"
    title: "Section references resolve and carry their own currency; the diff names sections"
    depends_on: ["M1"]
    stage_refs: ["STAGE-002"]
    obligation_refs: ["OBL-003", "OBL-004", "OBL-005"]
  - id: "M3"
    title: "The decision recorded as a proposed ADR"
    stage_refs: ["STAGE-003"]
    obligation_refs: ["OBL-006"]

  - id: "MB"
    title: "The battery, run as the gate these obligations cite"
    depends_on: ["M1", "M2", "M3"]
    stage_refs: ["STAGE-004"]
    obligation_refs: ["OBL-001", "OBL-002", "OBL-003", "OBL-004", "OBL-005"]

stages:
  - id: "STAGE-001"
    title: "sas_sections.rs, the lib.rs export, SECTIONS.json and SECTIONS.md in compile.rs"
    executor_kind: "agent"
    executor_ref: "agent://claude-code"
    responsibility_tier: "T2"
    context_sections: ["40-work-order.md#Deliverables", "20-basis.md#What the code does today (read 2026-09-23)"]
    budget_tokens: 10000
  - id: "STAGE-002"
    title: "sas.section-ref and sas.section-current in check.rs, war sas diff by section, 56-sas-sections.sh"
    executor_kind: "agent"
    executor_ref: "agent://claude-code"
    responsibility_tier: "T2"
    context_sections: ["40-work-order.md#Deliverables"]
    budget_tokens: 12000
  - id: "STAGE-003"
    title: "OW-ADR-0028, proposed"
    executor_kind: "agent"
    executor_ref: "agent://claude-code"
    responsibility_tier: "T2"
    context_sections: ["10-intent.md#Desired Outcome", "20-basis.md#Unknowns"]
    budget_tokens: 5000

  - id: "STAGE-004"
    title: "Run the conformance battery"
    executor_kind: "service"
    responsibility_tier: "T1"
    executor_ref: "gate://ops.conformance.plants@1.0.0"
    wall_time_seconds: 1800
