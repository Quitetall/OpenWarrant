evidence = """D-001 (authorize.rs) implements retain_superseded, and D-002 (49-authorization-retained.sh) contains the exact plant assertions for this claim ("revision 1 is kept beside revision 2", "the revision-1 envelope verifies" via attest.subject-archived, and the control check for attest.subject-drift), but obligation_evidence marks the terms 'attest.subject-archived' and (implicitly) the plant's own printed output as cut_from the gate run's stdout — the GR-ops.conformance.plants@1.1.0 receipt's stdout shown in the bundle is truncated (truncated:true) and its visible text jumps between unrelated plant sections (e.g. OW-WAR-0136, OW-WAR-0139) without ever showing the '== authorization retention (OW-WAR-0144) ==' section or its ar_ok/ar_fail lines. The overall summary '1214 passed, 0 failed' is shown, but it does not itself demonstrate the specific claims (byte-identical digest match, attest --verify producing subject-archived, and the drift control) since the section proving those specific assertions ran and passed was not carried in the bundle. Source code and script existing is not execution evidence."""
