obligation = "OBL-002"
disposition = "refuted"
evidence = "export.rs's `round_trip` function explicitly refuses the real case: when called with `reconnect: true` (the only case in which bytes are actually reconnected and checked, per §68.3), it immediately returns `RepoError::Message('legacy round-trip cannot verify preserved bytes: --reconnect is a claim, not an import...')` without ever calling `assemble` twice or comparing anything. The passing test `a_reconnected_round_trip_with_equal_digests_verifies` never calls `round_trip` or `assemble` at all — it constructs a `RoundTrip` struct by hand with two identical hardcoded digest literals and checks `verify()`, proving only the comparator's logic, not that an actual export→import→re-export cycle preserves bytes. No gate run in the bundle exercises a real reconnected round trip either, so RQ-083's byte-stability claim has no supporting evidence and the code itself demonstrates the check cannot currently succeed for real data."
performer = "claude"

