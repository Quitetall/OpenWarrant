obligation = "OBL-001"
disposition = "refuted"
evidence = "crates/openwarrant-cli/src/export.rs's own module doc and its `absent_reason` function state unconditionally that the exporter 'does not collect' four of §68.2's contents — 'actions and relevant audit receipts', 'runtime receipt refs', 'artifacts', and 'resolution and standing' — regardless of whether such sections exist for the Warrant. The Work Order's own prerequisite ('an export without resolution is not §68.2's export') is thus violated by design, and the module comment itself calls the category labels and digest 'insufficient preservation evidence'. The only test, `every_required_content_is_classified`, merely checks that each content string is classified as present-or-explained, not that populated sections are actually exported, so it cannot rescue the claim of completeness."
performer = "claude"

