obligation = "OBL-001"
disposition = "refuted"
evidence = "crates/openwarrant-cli/src/export.rs's `absent_reason` function unconditionally classifies 'actions and relevant audit receipts', 'runtime receipt refs', 'artifacts', and 'resolution and standing' as not collected, regardless of whether such records exist for a given Warrant — the module's own doc comment calls the resulting category labels 'insufficient preservation evidence.' This contradicts the Basis atom's stated prerequisite ('an export without resolution is not §68.2's export') and OBL-001's own scope ('for sections that exist'), since resolution/standing is never exported even when present. The only test, `every_required_content_is_classified`, checks merely that each of the 15 §68.2 contents is either supplied or has a stated absence reason — it does not check that populated sections are actually included — so it cannot establish completeness and instead documents the gap."
performer = "claude"

[verifier]
actor = "claude-verifier (claude-sonnet-5)"
kind = "agent"

[verifier.independence]
performer_transcript_blind = true
performer_rationale_blind = true
separate_writable_workspace = true
cannot_modify_subject_artifacts = true
cannot_modify_gate_definition = true
cannot_modify_gate_fixtures = true
separate_context_compilation = true
distinct_model_required = true
distinct_human_required = false
