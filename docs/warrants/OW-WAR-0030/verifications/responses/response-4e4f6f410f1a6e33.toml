[[verifications]]
obligation = "OBL-002"
disposition = "refuted"
evidence = "export.rs's `round_trip` function, when called with `reconnect: true` — the only setting under which bytes are actually reconnected per §68.3 — returns immediately with `RepoError::Message('legacy round-trip cannot verify preserved bytes: --reconnect is a claim, not an import...')` without calling `assemble` or comparing any bytes. The passing test `a_reconnected_round_trip_with_equal_digests_verifies` never invokes `round_trip` or `assemble`; it hand-builds a `RoundTrip{original_digest:'sha256:a', reexport_digest:'sha256:a', evidence_reconnected:true,...}` and calls `.verify()`, exercising only the comparator, not an actual export→import→re-export cycle. `an_unreconnected_round_trip_is_refused_as_vacuous` confirms the refusal path but is not evidence of stability. No gate run in the bundle exercises a real reconnected trip. The code itself shows the reconnected path cannot currently succeed for real data, so RQ-083's byte-stability claim is refuted, not merely unproven."
performer = "claude"
