schema = "oh.war/verification-response/v1"
warrant = "OW-WAR-0030"

[[verifications]]
obligation = "OBL-001"
disposition = "refuted"
evidence = "crates/openwarrant-cli/src/export.rs's `absent_reason` function unconditionally returns a fixed absence reason for 'actions and relevant audit receipts', 'runtime receipt refs', 'artifacts', and 'resolution and standing' for every call, with no branch that checks whether such records exist for the given Warrant — the file's own module doc says these category labels are 'insufficient preservation evidence.' This directly contradicts OBL-001's scope ('for sections that exist') and the Basis atom's stated prerequisite that resolution records exist (OW-WAR-0022 resolved). The sole test `every_required_content_is_classified` only asserts each of the 15 §68.2 contents has either a supplier or a stated absence reason; it never asserts that a populated section is actually emitted, so it cannot and does not establish completeness — it documents the omission instead. No gate-run excerpt in the bundle checks export completeness either."
performer = "claude"
[verifications.verifier]
actor = "claude-verifier (claude-sonnet-5)"
kind = "agent"
