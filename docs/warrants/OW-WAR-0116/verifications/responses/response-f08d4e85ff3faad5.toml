[[verifications]]
obligation = "OBL-002"
disposition = "not_established"
evidence = "The bundle's own war-check@1.0.0 run (GR-software.repo.war-check@1.0.0) — the gate OBL-002 designates — carries a WARN evidence.stale-binding stating the receipt was taken against tree:e68d1caf85390eea75caab55aea5f3b968ef329f while 139 paths outside bookkeeping have since changed, i.e. 'a run over an earlier source is a record, not evidence about this one.' Beyond that, obligation_evidence for OBL-002 shows the term 'war roadmap' (needed to confirm the Progress page's phase order matches `war roadmap`'s own output) as shown_in: [] — nowhere in the bundle — and shows '/api/progress' and '/api/version' as shown only in 'atoms' (i.e. only asserted in the obligation text itself, never in a deliverable or gate transcript). The actual route handler that would answer `/api/progress` and `/api/version` for the web UI, crates/openwarrant-cli/src/webui/mod.rs (D-001), is listed in deliverables_not_carried, so nothing here shows how the API view is built; the only carried source is progress_viewer.rs (D-006), which backs the older `war progress --serve` HTML view rather than confirmed webui API wiring. The ops.conformance.plants@1.1.0 run does print 'ok the progress view roadmap, phases, ladder' and 'ok a record change is seen the version moved,' but that gate is cited for OBL-001/OBL-003, not OBL-002 (per 45-milestones.yaml's MB obligation_refs), gives no phase count or ordering detail, and the plant script 63-webui.sh (D-011) that would define the assertion is itself not carried. Taken together the bundle does not carry evidence sufficient to establish the eleven-phase ordering, rung equality to `war status --json`, the unassigned/open-slug content, or the four-second refresh claim, and it affirmatively flags its designated gate's evidence as stale."
performer = "claude"
