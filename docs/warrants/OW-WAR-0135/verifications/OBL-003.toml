evidence = "D-002 (crates/openwarrant-cli/src/mark.rs) implements the four refusal paths the obligation requires: the NO_RESOLUTION constant/`satisfied`/`attested` returning unmet with 'Q47' text when resolution.toml is absent, `attested`'s 'no resolve attestation names ...' branch when attestations/ is absent, the `attest.failed`-driven unmet path when the DSSE signature does not verify, and `established`'s `v.admissible_for(floor)` unmet path ('not admissible at {floor}') for a performer-only verdict. D-005 (conformance/plants.d/57-assurance-mark.sh) drives exactly these four cases on the scratch MK-WAR-0001 corpus via the `mk_refused` helper: 'no resolution, no mark' (mv resolution.toml away, asserts BL-001/'Q47'), 'no attestation, no mark' (mv attestations/ away, asserts BL-002/'no resolve attestation'), 'a forged attestation, no mark' (bit-flips the DSSE signature with a no-op guard, asserts BL-002/'attest.failed'), and 'a self-verified obligation, no mark' (sets the verification's actor to the performer 'claude', asserts BL-003/'OBL-001: not admissible' — RQ-053's performer-only case). The gate run GR-ops.conformance.plants@1.1.0 (verdict pass, subject_digests contract sha256:da9d7ca9... matching this bundle's authorized_contract_digest) has a stdout excerpt (lines 483-511) showing each of these four labels printed as 'ok' with exactly the asserted detail text ('no resolution, no mark ... BL-001 unmet: Q47', 'no attestation, no mark ... BL-002 unmet: no resolve attestation', 'a forged attestation, no mark ... BL-002 unmet: attest.failed', 'a self-verified obligation, no mark ... BL-003 unmet: OBL-001: not admissible'), and the stdout tail confirms the overall battery result '1260 passed, 0 failed' for the tested commit. This shows all four required refusals actually executed and passing against the named scratch corpus, not merely asserted in source, so OBL-003 is established within its stated scope."
