evidence = "Deliverable D-001 (docs/adr/atoms/OW-ADR-0025-assurance-mark.md) states in its own Status section: 'Proposed by the performer under OW-WAR-0135. Not decided. Two blocking questions of that Warrant have no recorded answer from the owner' and 'Until the owner answers them and accepts this ADR, it records options and a recommendation, and it governs nothing.' Its Decision section reads 'Pending Q-001 and Q-002.' D-004 (docs/assurance/baseline-v1.toml) likewise carries status = \"proposed\" and states 'this file governs nothing until OW-ADR-0025 is accepted.' This directly contradicts OBL-001's required evidence that 'the ADR is accepted by the owner, not by its author' and that 'the ADR states Q-001's answer' (it states only a recommendation among options (a)/(b)/(c), not an owner decision). While the baseline's six requirements (BL-001..BL-006) do each name their evidence/unmet/unknown conditions in D-004, and the conformance run (ops.conformance.plants@1.1.0, stdout plant 'baseline v1 names its evidence') confirms this, the obligation as a whole requires owner acceptance and a decided Q-001 answer, both of which the bundle affirmatively shows have not occurred."
