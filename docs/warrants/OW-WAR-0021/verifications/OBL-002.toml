obligation = "OBL-002"
disposition = "established"
evidence = "verification.rs::Verification::admissible_for checks self.verifier.is_distinct_from(&self.performer) and returns VerificationError::SelfVerification when false; test self_verification_is_refused exercises this with actor claude and performer claude"
performer = "claude"

[verifier]
actor = "lamu:mimo-v2.5-pro"
kind = "agent"
model = "mimo-v2.5-pro"

[verifier.independence]
performer_transcript_blind = true
performer_rationale_blind = true
separate_writable_workspace = true
cannot_modify_subject_artifacts = true
cannot_modify_gate_definition = true
cannot_modify_gate_fixtures = true
separate_context_compilation = true
distinct_model_required = true
distinct_human_required = false
