[[verifications]]
obligation = "OBL-002"
disposition = "refuted"
evidence = "OBL-002's scope explicitly names dangling obligation_refs as one of the malformed-graph cases requiring refusal, but the fully-shown D-001 source's validate_references() only checks m.stage_refs against stage_ids and m.depends_on against milestone_ids — obligation_refs is parsed and stored on Milestone (via list(record, \"obligation_refs\")) but never validated against any known-obligation set, and MilestoneError declares no DanglingObligationRef variant. The test_names list confirms this gap: none of the thirteen tests (e.g. a_dangling_stage_ref_is_refused, a_dangling_dependency_is_refused, duplicate_ids_are_refused, a_dependency_cycle_is_refused) exercises a dangling obligation_ref. This is corroborated by atoms/60-assurance.md's own adequacy review, whose 'Executed attacks' list only three plants (dangling stage_ref, dependency cycle, milestone-only field on a stage), short of the obligation's own evidence bar of 'five plants, five observed refusals'. The bundle itself therefore shows the claim does not hold."
performer = "claude"
