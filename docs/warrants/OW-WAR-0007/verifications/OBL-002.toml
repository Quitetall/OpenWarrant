obligation = "OBL-002"
disposition = "refuted"
evidence = """OBL-002's scope explicitly includes dangling obligation_refs, but D-001's validate_references() (crates/openwarrant-core/src/milestones.rs) only checks m.stage_refs against stage_ids and m.depends_on against milestone_ids; obligation_refs is parsed via list(record, "obligation_refs") and stored on Milestone with no corresponding check against any known-obligation set, and MilestoneError has no DanglingObligationRef variant. The test suite confirms this gap: there is no dangling_obligation_ref test among the thirteen listed test_names. This is corroborated by atoms/60-assurance.md's own adequacy review, which lists only three executed attacks (dangling stage_ref, dependency cycle, milestone carrying a stage-only field) against the obligation's own evidence bar of 'five plants, five observed refusals' — the bundle itself shows the obligation's evidence requirement unmet."""
performer = "claude"

[verifier]
actor = "claude-verifier (claude-sonnet-5)"
kind = "agent"

[verifier.independence]
performer_transcript_blind = true
performer_rationale_blind = true
separate_writable_workspace = true
cannot_modify_subject_artifacts = true
cannot_modify_gate_definition = true
cannot_modify_gate_fixtures = true
separate_context_compilation = true
distinct_model_required = true
distinct_human_required = false
