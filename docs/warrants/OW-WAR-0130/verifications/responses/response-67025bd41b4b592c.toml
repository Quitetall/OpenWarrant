ecord mechanism, consistent with scope (option B, no claim on option C). No item in the bundle contradicts this; the obligation_evidence entry for OBL-003 shows every relevant term ('requires_war', 'compat.war-too-old', 'oh.war/verification/v9', 'compat.newer-record', 'war check') shown in full across D-004/D-005/D-006/D-007/D-008/D-013 and the gate stdout with no cut_from truncation."
