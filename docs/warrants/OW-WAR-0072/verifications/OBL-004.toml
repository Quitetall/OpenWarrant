obligation = "OBL-004"
disposition = "refuted"
evidence = "OBL-004 is scoped to attest.rs and docs/SIGNING.md, and obligation_evidence marks both as absent — 'no deliverable of OW-WAR-0072 and no file at this path: not carried' for attest.rs, and the analogous repository-path absence for docs/SIGNING.md. The terms 'war attest verify', 'attest.subject-drift' and 'oh.war/dsse' are shown only in atoms (attest.rs's term shown_in atoms, the other two shown nowhere), never in a plant or gate transcript. Since the two files the obligation names do not exist, there is no envelope code or documentation for a foreign verifier to check, so 'a foreign verifier can check a batch both ways' is refuted by their confirmed absence."
