schema: "oh.war/milestones/v1"

milestones:
  - id: "M1"
    title: "A moved acceptance is seen: war pins --candidate, UNKNOWN when history cannot say"
    stage_refs: ["STAGE-001"]
    obligation_refs: ["OBL-001", "OBL-002", "OBL-003"]
  - id: "M2"
    title: "Seen before merge, and what it requires next (per Q-001)"
    depends_on: ["M1"]
    stage_refs: ["STAGE-002"]
    obligation_refs: ["OBL-004", "OBL-005"]

  - id: "MB"
    title: "The battery, run as the gate these obligations cite"
    depends_on: ["M1", "M2"]
    stage_refs: ["STAGE-003"]
    obligation_refs: ["OBL-001", "OBL-002", "OBL-003", "OBL-005"]

stages:
  - id: "STAGE-001"
    title: "acceptance.rs, war pins --candidate, 56-acceptance-validity.sh"
    executor_kind: "agent"
    executor_ref: "agent://claude-code"
    responsibility_tier: "T2"
    context_sections: ["40-work-order.md#Deliverables", "20-basis.md#Unknowns"]
    budget_tokens: 12000
  - id: "STAGE-002"
    title: "ci.yml step, SIGNING.md section, and the Q-001 consequence"
    executor_kind: "agent"
    executor_ref: "agent://claude-code"
    responsibility_tier: "T2"
    context_sections: ["40-work-order.md#Deliverables", "20-basis.md#Unknowns"]
    budget_tokens: 8000

  - id: "STAGE-003"
    title: "Run the conformance battery"
    executor_kind: "service"
    responsibility_tier: "T1"
    executor_ref: "gate://ops.conformance.plants@1.0.0"
    wall_time_seconds: 1800
