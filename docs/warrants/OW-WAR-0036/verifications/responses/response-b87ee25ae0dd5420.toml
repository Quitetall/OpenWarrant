[[verifications]]
obligation = "OBL-001"
disposition = "not_established"
evidence = "OBL-001 requires evidence that a decision classifier is shared between OW-WAR-0010 and this Warrant, with a test asserting it. The only two carried deliverables, D-001 (crates/openwarrant-compiler/src/adr_overview.rs, an ADR-overview renderer) and D-002 (crates/openwarrant-core/src/structured.rs, a restricted YAML-subset parser), contain no classifier code and none of their listed test_names (e.g. renders_summary_buckets_and_full_bodies, parses_a_real_milestones_atom) assert anything about a shared classifier function. obligation_evidence for OBL-001 lists no named terms, and the gate run's visible stdout excerpts (lines 592-606, 2598, 2777, 2857) discuss unrelated checks (manifest.valid, journal.append-only, authority.signed, sas.pin-superseded) with no mention of a classifier. Nothing in the bundle decides this claim."
performer = "claude"
