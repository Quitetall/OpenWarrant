evidence = "JDG-001 in atoms/60-assurance.md groups OBL-002 with OBL-001 as open precisely because 'No agent has been invoked,' meaning no interview producing an agent-authored Draft Proposal has taken place. The obligation_evidence for OBL-002 shows only the term 'war check' surfaced in the generic gate stdout, with no verbatim request, no returned proposal, and no §74.4 eight-step trace anywhere in the bundle (deliverables is an empty list). The gate stdout itself is corpus-wide structural validation (e.g. 'PASS manifest.valid', 'PASS traceability.refs') and its NOT CHECKED section states plainly that 'war check' does not execute gates or verify runs. Since the same authored record that defines this obligation states the underlying agent run never happened, the claim that 'one vague sentence produced an applied draft' does not hold."
