disposition = "not_established"
evidence = "OBL-003's scope is explicitly 'the whole run in OBL-002,' and JDG-001 states that run never occurred ('No agent has been invoked'). The obligation_evidence entry for OBL-003 lists the term 'write_file' with both shown_in and cut_from empty, meaning no plant output, filesystem audit, or refusal message naming write_file is carried in the bundle. The sole 'plants' entry (conformance/plants.d/71-plan.sh, line 3) is a source comment about fixture design ('Fixture-driven (OW-WAR-0042 OBS-002): every plant feeds a committed file'), not a test result. With no run to audit and no admissible evidence carried either confirming a clean run or showing an improper write, the bundle simply does not carry enough to decide this claim either way."
