schema = "oh.war/verification-response/v1"
warrant = "OW-WAR-0042"

[[verifications]]
obligation = "OBL-001"
disposition = "refuted"
evidence = "atoms/20-basis.md's Assumptions and Unknowns section records as a 'Blocking unknown' that 'No drafting agent speaks oh.war/agent-drafter/v1 today' and that Katana, the preferred adapter, 'is not cloned on this host.' atoms/60-assurance.md's JDG-001 (authored by QuiteTall, admissibility controlled_measurement) states directly: 'OBL-001 and OBL-002 require a real drafting agent answering over §75.2 as a SEPARATE PROCESS... No agent has been invoked... All three are recorded as open rather than narrowed: each needs work, not a decision that it cannot be done.' The obligation_evidence entry for OBL-001 carries no named_paths and no terms at all, and the gate run's stdout (software.repo.war-check@1.0.0) only performs structural checks (e.g. 'PASS obligations.valid ... 4 obligation(s), each with a bounded scope and evidence,' 'PASS identity.atom-mismatch') with no mention of a stdin/stdout exchange with a separate drafting process; the gate's own NOT CHECKED footer confirms 'war check does not invoke [gates], so nothing here is evidence that a Warrant's acceptance gates were run.' The Warrant's own authored record affirmatively states the required event has not occurred, so the claim is refuted rather than merely unproven."
performer = "claude"
[verifications.verifier]
actor = "claude-verifier (claude-sonnet-5)"
kind = "agent"
[verifications.verifier.independence]
performer_transcript_blind = true
performer_rationale_blind = true
separate_writable_workspace = true
cannot_modify_subject_artifacts = true
cannot_modify_gate_definition = true
cannot_modify_gate_fixtures = true
separate_context_compilation = true
distinct_model_required = true
distinct_human_required = false

