    before: "D-001..D-011."
    after: "Also D-012: crates/openwarrant-cli/src/lib.rs, the --issue/--issue-file flags and the plan wiring; D-013: crates/openwarrant-cli/src/next.rs, intake questions as human answer acts; D-014: crates/openwarrant-cli/src/mcp/tools.rs, an issue input on the war_plan_* MCP tools."

