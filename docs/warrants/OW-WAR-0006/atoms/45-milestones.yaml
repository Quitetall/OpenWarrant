schema: "oh.war/milestones/v1"

milestones:
  - id: "M1"
    title: "ADR relations parse and round trip"
    stage_refs: ["STAGE-001"]
    obligation_refs: ["OBL-001"]

  - id: "M2"
    title: "Supersession cycles and status/currency conflicts are refused"
    depends_on: ["M1"]
    stage_refs: ["STAGE-002"]
    obligation_refs: ["OBL-002"]

  - id: "M3"
    title: "The untracked Overview commit is recorded and adopted"
    stage_refs: ["STAGE-003"]
    obligation_refs: ["OBL-003"]

stages:
  - id: "STAGE-001"
    title: "Add typed ADR relations and derive currency from them"
    executor_kind: "human"
    responsibility_tier: "T2"

  - id: "STAGE-002"
    title: "Plant a supersession cycle and a status/currency conflict"
    executor_kind: "human"
    responsibility_tier: "T1"

  - id: "STAGE-003"
    title: "Record the §95 untracked-work finding in the Progress Log"
    executor_kind: "human"
    responsibility_tier: "T1"
