disposition = "not_established"
evidence = "D-001 (crates/openwarrant-core/src/adr.rs) contains `supersession_relations_are_read_in_both_directions`, which only exercises AdrRecord::parse on frontmatter text and asserts the resulting `supersedes`/`superseded_by` fields — it never serializes an AdrRecord back to text and reparses it, so no 'canonical round trip' as OBL-001's evidence requirement names is present anywhere in D-001, D-002, or D-003. The sole gate run, GR-software.repo.war-check@1.0.0 (`war check --generated`), is not a test runner: its own stdout NOT CHECKED section states 'gate execution — `war gate --run` executes a registered gate (§44), but `war check` does not invoke it, so nothing here is evidence that a Warrant's acceptance gates were run,' so there is no execution record in the bundle showing the listed test_names were ever run, let alone passed. obligation_evidence for OBL-001 shows 'supersedes'/'superseded_by' appearing only in source deliverables and atoms text, not in any gate output demonstrating a round trip."
