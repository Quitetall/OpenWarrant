schema: "oh.war/milestones/v1"

milestones:
  - id: "M1"
    title: "A workflow deploys the committed projection and proves the bytes"
    stage_refs: ["STAGE-001"]
    obligation_refs: ["OBL-001", "OBL-002"]

  - id: "M2"
    title: "The site is live and serves the committed page"
    depends_on: ["M1"]
    stage_refs: ["STAGE-002"]
    obligation_refs: ["OBL-003"]

stages:
  - id: "STAGE-001"
    title: "pages.yml; the workflows gate step and its tests"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-002"
    title: "Enable Pages; first deploy; record the served digest"
    executor_kind: "agent"
    responsibility_tier: "T2"
