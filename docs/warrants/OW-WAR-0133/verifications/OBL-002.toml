obligation = "OBL-002"
disposition = "established"
evidence = "D-005 (conformance/plants.d/55-evidence-reuse.sh) contains all three required scenarios under the OBL-002 heading: 'a committed run counts' (records evidence, then checks both `war check` for evidence.admissible and `war resolve --dry-run` for the requirement-5-met line), 'a changed deliverable, committed' (mutates one byte of the declared deliverable, commits, and expects evidence.stale-binding naming the moved subject plus requirement-5-unmet), and the control 'an unrelated commit leaves it' (a commit touching nothing the inputs rule reads must remain evidence.admissible with requirement 5 still met, asserting no evidence.stale-binding appears). The gate run GR-ops.conformance.plants@1.1.0 for OW-WAR-0133 (subject_digests bound to this contract, deliverables digest and tree, verdict pass) has a stdout excerpt at line 368 directly confirming the changed-deliverable half verbatim: 'ok a changed deliverable rejected by evidence.stale-binding naming inputs:sha256:c66fce...; requirement 5 unmet'. The stdout's tail (shown as 'text' since the stream is truncated) reports the battery's aggregate result as '1260 passed, 0 failed', which necessarily includes every er_ok/er_fail assertion in 55-evidence-reuse.sh — had the 'a committed run counts' or 'an unrelated commit leaves it' checks failed, the failed count would be nonzero and a FAILED line would appear, as it does for genuinely failing plants elsewhere in the same output (e.g. the fixed-/tmp-path and quiet-grep plants). obligation_evidence for OBL-002 confirms the terms 'war check', 'war resolve --dry-run' and 'evidence.stale-binding' are shown (not cut_from budget) across D-002/D-005/D-006/D-010 and both gate stdouts, so nothing decisive was trimmed. The scenarios run on an isolated scratch corpus (ER_ROOT, guarded against acting on the real repo) exercising both the Q-001(c) inputs-based rule (plant.reads) and the Q-001(a) tree fallback (plant.tree), matching the obligation's stated scope."
performer = "claude"

