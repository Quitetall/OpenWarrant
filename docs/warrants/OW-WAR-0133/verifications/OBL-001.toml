obligation = "OBL-001"
disposition = "not_established"
evidence = "D-005 (conformance/plants.d/55-evidence-reuse.sh, carried whole, untruncated) defines the exact assertions OBL-001 requires: the 'a clean receipt names its source' case checks subject_digests for contract:sha256:*, tree:<HEAD^{tree}>, deliverables:sha256:<digest> plus a seal-verify, and the 'a dirty receipt says so' case checks worktree:dirty plus seal-verify. The gate run for gate://ops.conformance.plants@1.1.0 (run_id GR-ops.conformance.plants@1.1.0, verdict pass, subject_digests matching authorized_contract_digest b5c583da...903349) is the recorded execution of this script (arguments: bash conformance/plant-isolated.sh), but its stdout is truncated:true and only two excerpts are shown: line 365, 'ok a dirty receipt says so worktree:dirty named, seal recomputes; reuse-unknown (dirty tree has no name)', which directly confirms only the dirty-tree half of the claim, and line 981, an unrelated check. No excerpt shows the 'a clean receipt names its source' line, so the clean-tree half (naming of contract/tree/deliverables and its own seal recompute) is not directly evidenced. The stdout tail gives only an aggregate 'tested commit 9f55131c7aeee59e99b2c258b8ee0ccd86614b60 ... 1260 passed, 0 failed' across the whole battery, which cannot stand in for the specific unshown line under the bundle's own rule that bytes not shown are not evidence either way. Separately, the sole prior_verification on file for OBL-001 asserts figures ('1214 passed, 0 failed', 'tested commit 39d30f3d2b2ca57dd9864ce4c6f6c804b8c32f88') that do not match this bundle's actual gate-run stdout, so that account is unreliable and is not relied on here. With only the dirty-tree bullet directly shown and the clean-tree bullet and one seal-recompute claim unshown, the obligation is not established."
