obligation = "OBL-003"
disposition = "not_established"
evidence = "OBL-003's evidence clause requires that 'the runtime dimension reports unknown while no live actor exists, on every run' — i.e. actual behavior of Preflight runs, not just the type's capability. The bundle contains no war preflight CLI deliverable, no generated receipt, and no gate-run output demonstrating an actual run where the runtime group reports NotRun/unknown; the gate run stdout confirms Preflight is not implemented/executed ('Preflight is not implemented, and war check does not run gates'). The cited test the_receipt_states_what_it_does_not_prove only checks that PreflightReceipt::meaning() contains the §32.7 disclaimer string; it says nothing about the runtime dimension's outcome on any run, so it cannot establish this obligation."
performer = "claude"

