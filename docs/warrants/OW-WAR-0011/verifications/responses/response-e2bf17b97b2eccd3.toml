[[verifications]]
obligation = "OBL-003"
disposition = "not_established"
evidence = "OBL-003's scope is 'every Preflight run' and its evidence clause requires the runtime dimension to report unknown while no live actor exists, on every actual run — not merely that the type is capable of representing NotRun. The bundle carries no war preflight CLI deliverable, no generated receipt from a real invocation, and no gate-run output showing a run where the runtime group reports NotRun/unknown; the gate run stdout instead confirms 'Preflight readiness (§32.7)' is NOT CHECKED because Preflight is not implemented. The cited test the_receipt_states_what_it_does_not_prove only asserts that PreflightReceipt::meaning() contains the §32.7 disclaimer text and says nothing about the runtime dimension's outcome on any run, so it cannot establish this per-run reporting claim."
