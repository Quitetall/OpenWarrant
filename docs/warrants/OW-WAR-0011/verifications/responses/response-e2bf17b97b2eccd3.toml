[[verifications]]
obligation = "OBL-002"
disposition = "not_established"
evidence = "OBL-002's evidence clause requires 'a plant; the verdict is not-ready with the dimension named,' consistent with milestones.yaml STAGE-002 ('Plant an unresolvable context and an absent gate tool'). The bundle's plants array is empty, and obligation_evidence for OBL-002 lists no named_paths or terms carried. The gate run GR-software.repo.war-check@1.0.0 stdout explicitly places 'Preflight readiness (§32.7)' under NOT CHECKED, stating 'Preflight is not implemented, and war check does not run gates' — i.e. no war-level check exercises this at all. The in-memory unit test not_run_blocks_exactly_as_failed_does manipulates a synthetic PreflightReceipt directly; it is not a plant of an unresolvable context or absent gate tool and shows no not-ready verdict produced against a planted scenario. Nothing in the bundle demonstrates the required planted blocking case."
