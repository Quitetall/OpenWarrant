[[verifications]]
obligation = "OBL-001"
disposition = "established"
evidence = "crates/openwarrant-core/src/preflight.rs (D-001, untruncated, 460 lines) defines all six §32 groups as a vocabulary (CheckGroup::Contract/Context/Graph/Runtime/Gates/Authority) backed by CONTRACT_CHECKS/CONTEXT_CHECKS/GRAPH_CHECKS/RUNTIME_CHECKS/GATE_CHECKS/AUTHORITY_CHECKS transcribed verbatim from §32.1–§32.6, and the test the_check_groups_and_counts_match_the_sas pins their counts (6,6,5,10,9,5 summing to TOTAL_CHECKS=41) and asserts no duplicate check names. PreflightReceipt::outcome() returns CheckOutcome::NotRun for any check absent from the map rather than Passed, and the tests not_run_blocks_exactly_as_failed_does and an_absent_check_is_not_run_not_passed show a check either resolves to a readiness-permitting outcome (Passed/NotApplicable) or blocks (NotRun/Failed) — an empty receipt blocks on all 41 checks across all six groups, so none is silently omitted. This is exactly the evidence OBL-001 names, present in full in the carried deliverable."
performer = "claude"
