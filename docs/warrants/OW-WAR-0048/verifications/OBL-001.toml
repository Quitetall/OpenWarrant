evidence = """The bundle's deliverables array is empty and obligation_evidence for OBL-001 lists no carried named_paths; the only place the required triples (x86_64-unknown-linux-gnu, aarch64-apple-darwin) appear is 'shown_in: ["atoms"]', i.e. mentioned in the Intent/Basis atoms as targets to run against, not as a record of an actual run. The sole gate run, GR-software.repo.war-check@1.0.0, is a generic `war check --generated` invocation whose own NOT CHECKED section states 'war check does not invoke [gates], so nothing here is evidence that a Warrant's acceptance gates were run,' and its visible truncated stdout excerpts discuss OW-WAR-0048's manifest/traceability/journal checks and unrelated warrants, never a two-host byte comparison of canonical JSON. The Basis atom itself frames the two-host run as a still-needed step, not a completed one. No evidence of the claimed run exists in the bundle."""
