obligation = "OBL-002"
disposition = "not_established"
evidence = "The obligation's required evidence is 'a plant where OpenWarrant fabricates a receipt, refused,' but the bundle's plants array is empty, so that specific evidence is entirely absent. KatanaReceipt::validate() in D-001 (fully shown) only checks non-empty required fields and that dispatch_digest matches an expected value — it has no provenance or signature check — so the code alone neither confirms nor rules out that a hand-fabricated receipt with matching digest would be refused in practice. Absent the plant and any test exercising the actual consume/attach path against a fabricated receipt, and with the gate run's own NOT CHECKED note confirming gates/tests are not executed by war check, there is not enough in the bundle to decide this either way."
