schema = "oh.war/rationale/v1"

# §36.2 — accepted residual risk.
#
# Each entry transcribes this Warrant's own "## Residual Risk" section from its
# assurance atom, which stated the risk in prose that nothing could read.
#
# `judgment_ref` is EMPTY, and deliberately. The status names the class of
# assumption — a residual risk, to be accepted — while `judgment_ref` is where an
# acceptance is recorded. Nobody has accepted these. §27.2 forbids an agent
# accepting organizational residual risk, so the field stays empty until a human
# signs a judgment through `war authorize`, and `war resolve` reports
# requirements 9 and 11 unmet until one does.

# §36.3, not §36.2. This Warrant's own Residual Risk section says it is
# unstartable / provisional pending something outside this repository, and that
# is a BLOCKING UNKNOWN rather than a risk somebody could weigh and accept.
# Filing it as an accepted residual risk would offer it to an authorizer as a
# decision they could make, when there is nothing to decide until the missing
# thing exists.

[[assumption]]
id = "A-001"
statement = "Whether the Katana seam matches Katana's actual schema is unknown and unknowable from this host."
epistemic_status = "blocking_unknown"
resolution_requirement = "A checkout of Katana at or after 651ba435, against which the seam's types can be compared."
