# The derived views: what `war compile` writes from the masters. The one list.
#
# Owner decision, 2026-11-07: views are written on main only. A pull request
# edits masters and never carries a view; after each push to main the Views
# workflow (.github/workflows/views.yml) compiles and commits them. Read by
# conformance/views.py, which every check and that workflow call; a new kind
# of view joins by adding its glob here.
#
# `*` matches one path segment, `**` any number. A Warrant's own generated/
# is derived only while the Warrant has no resolution.toml: a resolved
# Warrant's committed projection is part of its record, never regenerated by
# the workflow or changed by a pull request (views.py, `record`).
schema = "ow.views/v1"

derived = [
    "docs/generated/**",
    "docs/warrants/generated/**",
    "docs/adr/generated/**",
    "docs/sas/generated/**",
    "docs/roadmap/generated/**",
    "docs/records/*/generated/**",
    "docs/warrants/*/generated/**",
    # The pages the master/view layout (agent/a8-format) renders: open work
    # orders, and closed ones. Not written today; listed so they are views
    # from their first compile. Its one page per document joins here by glob
    # once that layout names where the pages go.
    "docs/ROADMAP.md",
    "docs/HISTORY.md",
]

# Under a derived glob, but a record once this file sits beside generated/.
record_marker = "resolution.toml"
record_glob = "docs/warrants/*/generated/**"

# Human numbers (owner approval, 2026-11-07). The Views workflow gives each
# new id the next number the first time it sees the id on main, and appends
# it to `index` (id, number, first-seen commit). Append-only: a number is
# never changed or reused, and a removed id keeps its row. The index is under
# a derived glob, so only the workflow writes it and a pull request is refused
# for touching it. An id is the name, without extension, of each tracked path
# matching `sources`; agent/a8-format's layout sets these globs.
[numbers]
index = "docs/generated/numbers.tsv"
sources = ["docs/work/*"]
