actor = "Fixture Human"
actor_kind = "human"
roles = ["authorizer", "resolver", "risk_acceptor", "judge"]
assigned_by = "Fixture Human"
effective_time = "2026-01-01T00:00:00Z"
note = "Synthetic fixture signer."
ssh_principal = "fixture-human"

