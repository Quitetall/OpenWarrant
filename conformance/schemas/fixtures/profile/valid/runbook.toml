schema = "oh.war/profile/v1"
name = "runbook"
form = "document"
note = "An operational runbook."
capabilities = ["structure", "links"]

[frontmatter]
required = []
optional = ["owner"]

[sections]
required = ["Steps"]
closed = true

[records]
types = ["step"]

[fields.step]
command = { required = true, shape = "line" }
severity = { shape = "enum", values = ["low", "high"] }

[[presets]]
name = "oncall"
steps = ["out:depends_on", "in:constrains"]
depth = 1
budget = "none"
editable = true
