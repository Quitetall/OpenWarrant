# SPDX-License-Identifier: Apache-2.0
#
# Which plant files a changed path can touch, for Fast CI (`plant-select.py
# affected`). A plant found days after the code that broke it is the cost of not
# running plants on a pull request; a map that quietly skips one is the cost of
# running them carelessly. So this file only ever narrows, and only where a rule
# says so:
#
#   - A changed plant file always selects itself; no rule is needed.
#   - A path no rule names selects EVERY plant, with a warning on the pull
#     request. An unknown file is a question, and it is answered by running more.
#   - A plant no rule names runs on every change, so a new plant is covered from
#     its first commit. Map it when it gets in the way.
#   - `plants = ["*"]` is every plant. `plants = []` says no plant reads the path:
#     the rule must be true, and 187-plant-selection.sh checks each such path
#     against the text of the plants.
#
# A rule states what a change is LIKELY to break, not what it could. Any Rust
# change can in principle reach any plant, and this tier makes no claim about
# plants it did not run: the full gate (`cargo xtask gate`, nightly and before
# a pin) runs all of them. When unsure, leave a path out of every rule.
#
# Paths: `*` stops at a slash, `**` does not. Plants: shell globs over file names.
# `plant-select.py check-map` refuses a rule that names nothing real.

# ---- every plant -----------------------------------------------------------

[[rule]]
name = "the battery itself"
paths = ["conformance/lib.sh", "conformance/plant.sh", "conformance/plant-isolated.sh"]
plants = ["*"]

[[rule]]
name = "the build"
paths = [
    "Cargo.lock", "Cargo.toml", "rust-toolchain.toml", ".cargo/config.toml",
    "crates/*/Cargo.toml", "crates/*/build.rs",
]
plants = ["*"]

# Every `war` reaches these. A module is here when ten or more others use it,
# which is what `crate::<module>` said when this list was written; a leaf module
# that grows callers belongs here.
[[rule]]
name = "foundations"
paths = [
    "crates/openwarrant-core/**",
    "crates/openwarrant-compiler/**",
    "crates/openwarrant-agent/**",
    "crates/openwarrant-cli/src/main.rs",
    "crates/openwarrant-cli/src/lib.rs",
