[[item]]
id = "K11"
title = "Check a perft suite file"
summary = "`perft-suite <file.epd> [--max-depth N]` runs perft (K1) on every position of an EPD-style suite and reports each `;D<d> <count>` entry as passed, failed or skipped."
description = '''
K1's `perft` checks one position at a time. Move-generator regressions are
caught with suites of many positions and published counts. Add:

    knightlm perft-suite <file.epd> [--max-depth N]

Suite format, one position per line:

    rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - ;D1 20 ;D2 400

- Blank lines and lines starting with `#` are ignored; leading and trailing
  whitespace is ignored.
- The text before the first `;` is the position: either the four FEN fields
  placement, side, castling, en passant (the counters are then `0 1`), or a full
  six-field FEN. It must be a valid standard position.
- Each `;`-separated entry after it is `D<depth> <count>`: depth an integer of
  at least 1, count a non-negative integer. A line needs at least one entry and
  may not list the same depth twice. Entries may come in any order.

Nodes are counted exactly as `perft` (K1) counts them, so adjudicated positions
(dead positions, for example) still have their moves counted.

`--max-depth` defaults to perft's maximum depth from K1. It must be between 1
and that maximum, otherwise the command is refused with `--max-depth must be
between 1 and <maximum>`. Entries deeper than `--max-depth` are not computed:
they are counted in `skipped` and not listed.

Output is one JSON object:

    {"positions": P, "checked": C, "passed": X, "failed": F, "skipped": S, "results": [...]}

with one result per checked entry, in file order and, within a line, in the
order the entries are written:

    {"line": <1-based line number in the file>, "fen": "<six-field FEN>",
     "depth": d, "expected": <count>, "nodes": <perft count>, "pass": <bool>}

`positions` counts position lines; `fen` is the six-field FEN (with `0 1`
appended to a four-field position). When `failed` is 0 the exit status is 0;
otherwise the JSON is printed and the command exits nonzero with stderr
containing `perft suite failed: <failed> of <checked>`.

A malformed line refuses the whole suite: nonzero exit, nothing on stdout, and
stderr contains `line <L>: ` with L its 1-based line number. A suite with no
position lines, or a file that cannot be read, is refused too.
'''
acceptance = [
  "A one-line start-position suite prints exactly the documented report with both entries passing and exits 0.",
  "Kiwipete, position 3 and position 5 (K1 notes) pass at depths 1 to 3, with four-field positions reported with `0 1` and six-field FENs kept as given.",
  "Line numbers count every line of the file, including comments and blanks, and results follow file order and the written entry order.",
  "A wrong count is reported with its actual node count and `pass: false`, then the command exits nonzero with `perft suite failed: <F> of <C>`.",
  "Entries deeper than `--max-depth` (default: perft's maximum depth from K1) are skipped and counted, not computed.",
  "`--max-depth` 0 or above perft's maximum depth is refused with the documented message.",
  "Dead and checkmated positions are counted by movement rules (a checkmate gives 0).",
  "Missing counts, lines without entries, depth 0, duplicate depths, non-numeric counts, unknown labels, a position with the wrong number of fields and an invalid position are refused with `line <L>: `.",
  "An empty suite, a comment-only suite and a missing file are refused with nothing on stdout.",
]
notes = '''
- Key names are exact, in the report and in every result.
- A position line with only skipped entries still counts in `positions`.
'''
depends_on = ["K1"]
check = ["python3", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{hidden}"]
timeout_secs = 600
