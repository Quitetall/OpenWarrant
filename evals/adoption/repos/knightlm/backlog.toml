[[item]]
id = "K10"
title = "Extract a ply range as its own game record"
summary = "`extract <game.json> --from-ply N [--to-ply M] [--pgn]` cuts moves N..M out of a game as a new record starting from the position after N plies."
description = '''
Training examples often need a game fragment: the moves from some point on,
starting from the position reached there. Add:

    knightlm extract <game.json> --from-ply N [--to-ply M] [--pgn]

Plies are counted from the record's first move: ply 0 is the record's initial
position, and the fragment holds the moves with (0-based) indices N up to but
not including M, that is `moves[N..M]`. `--to-ply` defaults to the number of
moves in the record. `--from-ply` is required.

The output is a `GameRecord` (JSON on stdout):

- `schema_version`: 1.
- `game_id`: `<original game_id>@<N>-<M>`, with M the effective end (so
  `--from-ply 4` on a 6-move game gives `...@4-6`).
- `source`: `extract:<original source>`.
- `initial_fen`: the current FEN after the first N moves, exactly as `compile`
  reports it for a record with those moves.
- `moves`: `moves[N..M]` in standard UCI.
- `history_complete`: an extract always starts from a stated position, exactly
  like a PGN game with a `FEN` tag, also when N is 0 and the position is the
  standard start. Set it by the rule K4 recorded for such games.

With `--pgn` the command prints the extracted record as `export-pgn` (K5) would
print it, instead of JSON.

Refusals (nonzero exit, nothing on stdout): an invalid record (it is replayed in
full first); a range with N > M or M greater than the number of moves, with
stderr containing `ply range out of bounds`; a missing or negative
`--from-ply`.
'''
acceptance = [
  "A middle range prints exactly the documented record: `<id>@N-M`, `extract:<source>`, the FEN after N plies, the moves N..M and `history_complete` by the K4 rule.",
  "Without `--to-ply` the extract runs to the last move.",
  "`--from-ply 0` keeps the original initial FEN and all moves, and `history_complete` still follows the K4 rule.",
  "An empty range (N = M) is a record with no moves; a source without complete history works the same way.",
  "For every N, `initial_fen` equals the FEN `compile` reports after N moves, and compiling the extract gives the original game's final FEN.",
  "A setup record's plies count from its own first move.",
  "`--pgn` prints the extract as `export-pgn` would, including the SetUp/FEN tags and move numbers taken from the FEN, and it re-imports with `import-pgn` to the same game_id, initial_fen, history_complete and moves.",
  "Ranges with N > M or ending past the last move are refused with `ply range out of bounds`; a missing or negative `--from-ply` and an invalid record are refused.",
]
notes = '''
- Ply indices are 0-based positions between moves: `--from-ply 2 --to-ply 4`
  on `e2e4 e7e5 g1f3 b8c6 f1b5` gives `g1f3 b8c6`, starting after `e7e5`.
- The extract keeps no repetition history from before ply N; that is why its
  history claim follows the setup-position rule.
'''
depends_on = ["K4", "K5"]
check = ["python3", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{hidden}"]
timeout_secs = 600

