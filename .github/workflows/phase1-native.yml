name: Native Phase 1 acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/phase1-native.yml'
      - 'conformance/sdk/run_phase1.py'
      - 'conformance/sdk/phase1.json'

permissions:
  contents: read

concurrency:
  group: phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Phase 1 ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run complete current-host inventory
        env:
          RECEIPT: ${{ runner.temp }}/phase1-${{ runner.os }}.json
        run: python3 conformance/sdk/run_phase1.py --output "$RECEIPT"
      - name: Retain exact observation, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase1-${{ runner.os }}
          path: ${{ runner.temp }}/phase1-${{ runner.os }}.json
          if-no-files-found: error
