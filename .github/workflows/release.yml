name: Release

# Fires only on a version tag. Never on push — building release artifacts on
# every commit is the spending pattern ADR 0179 measured turning a $20 month into
# three and a half pushes.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  # A release pipeline that can only be exercised by cutting a real tag is a
  # pipeline whose first real use is its first test. `workflow_dispatch` runs
  # everything except the publish step, so packaging and the artifact
  # upload/download pairing can be proven before a version number is spent —
  # and a spent version number cannot be reused, because yanked versions stay
  # yanked.
  workflow_dispatch:
    inputs:
      preview_tag:
        description: 'Publish an owner-requested alpha preview after native checks; empty means rehearsal only'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag must not be able to ship something that would fail CI. Running the
  # same single gate command means a release cannot be greener than main.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: cargo-deny
      - run: python3 conformance/release/test_preview.py
      - run: cargo xtask gate

  build:
    name: build ${{ matrix.target }}
    needs: gate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p openwarrant-cli

      # §91.1 test 1 — two hosts, one IR. Each host compiles every Warrant
      # and lists the sha256 of every WAR.json; the publish job diffs the two
      # lists against each other and against the committed files. Any
      # difference fails the release: a digest that depends on the host is
      # not a digest.
      - name: IR parity list
        shell: bash
        run: |
          set -euo pipefail
          ./target/${{ matrix.target }}/release/war compile
          find docs/warrants -name WAR.json | sort | xargs sha256sum > "ir-${{ matrix.target }}.sha256"
          git diff --quiet -- docs/warrants || { echo "compile on ${{ matrix.target }} moved a committed projection" >&2; git --no-pager diff --stat -- docs/warrants; exit 1; }
          # A list over nothing would compare equal to another list over nothing.
          n=$(wc -l < "ir-${{ matrix.target }}.sha256")
          [[ "$n" -ge 1 ]] || { echo "no WAR.json compiled on ${{ matrix.target }}" >&2; exit 1; }
          echo "$n WAR.json digests listed"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ir-${{ matrix.target }}
          path: ir-${{ matrix.target }}.sha256

      # A published binary nobody can verify is a binary nobody should run.
      # SHA-256 travels with it, matching the algorithm the protocol itself uses
      # for every other digest (§65.1).
      - name: Package
        env:
          PREVIEW_TAG: ${{ inputs.preview_tag }}
        shell: bash
        run: |
          set -euo pipefail
          label="${GITHUB_REF_NAME//\//-}"
          if [[ -n "$PREVIEW_TAG" ]]; then
            [[ "$PREVIEW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]] || exit 1
            [[ "$(./target/${{ matrix.target }}/release/war --version)" == "war ${PREVIEW_TAG#v}" ]] || exit 1
            label="$PREVIEW_TAG"
          fi
          mkdir -p dist
          python3 conformance/release/package.py \
            --war "target/${{ matrix.target }}/release/war" \
            --output dist/candidate --label "$label"
          python3 - <<'PYTHON'
          import json, subprocess
          from pathlib import Path
          root=Path("dist/candidate")
          item=json.loads((root/"candidate.json").read_text())
          subprocess.run(["python3","conformance/release/install_check.py",
              "--archive",str(root/item["archive"]),"--sha256",item["sha256"],
              "--output",str(root/"install-${{ matrix.target }}.json")],check=True)
          (root/"candidate.json").rename(root/"candidate-${{ matrix.target }}.json")
          PYTHON

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target }}
          path: dist/candidate/*

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: IR parity across hosts
        shell: bash
        run: |
          set -euo pipefail
          lists=(dist/ir-*.sha256)
          [[ ${#lists[@]} -ge 2 ]] || { echo "fewer than two IR lists" >&2; exit 1; }
          for l in "${lists[@]}"; do diff -u "${lists[0]}" "$l"; done
          # And against the committed tree: the release ships what is committed.
          find docs/warrants -name WAR.json | sort | xargs sha256sum | diff -u "${lists[0]}" -
          echo "IR is byte-identical on every host and matches the committed tree"

      - name: Verify the artifact round trip
        run: |
          set -euo pipefail
          echo "downloaded:"; ls -la dist
          test -n "$(ls dist/*.tar.gz 2>/dev/null)" || { echo "no archives downloaded" >&2; exit 1; }
          for f in dist/*.tar.gz; do tar -tzf "$f" >/dev/null || exit 1; done
          echo "all archives download and extract"

      # Only a tag creates a release. A manual run stops here, having proven
      # everything except the irreversible step.
      - name: Refuse publication until release qualification exists
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Publication is blocked: candidate rehearsal does not supply OW90 qualification or OW91 owner release permission." >&2
          exit 1

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Pre-1.0 and prerelease tags are marked as such, so nobody installs a
          # 0.x build believing the wire format is stable. It is not.
          prerelease=""
          case "${{ github.ref_name }}" in
            v0.*|*-*) prerelease="--prerelease" ;;
          esac
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file CHANGELOG.md \
            $prerelease \
            dist/*

  # crates.io, in dependency order, only from a tag, and only under the
  # licence the relicense produces: a version published under
  # AGPL-3.0-or-later stays under it permanently (docs/PUBLISHING.md).
  crates:
    name: publish crates
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: The relicense must have happened
        shell: bash
        run: |
          set -euo pipefail
          # Through cargo's own view of the manifest, not a grep of the file.
          for crate in openwarrant-core openwarrant-agent openwarrant-compiler openwarrant-cli; do
            lic=$(cargo metadata --format-version 1 --no-deps | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .license')
            [[ "$lic" == "Apache-2.0" ]] || { echo "$crate is licensed $lic; RELICENSING.md first" >&2; exit 1; }
          done
          grep -q 'Apache License' LICENSE && grep -q 'Version 2.0' LICENSE || { echo "LICENSE is not the Apache-2.0 text" >&2; exit 1; }
      - name: Publish in order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$CARGO_REGISTRY_TOKEN" ]] || { echo "CARGO_REGISTRY_TOKEN is not set" >&2; exit 1; }
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "openwarrant-core") | .version')
          # Each crate waits until the sparse index serves its version before
          # the next publish resolves it; a fixed sleep is a guess, this is a
          # check. A crate already published at this version is skipped, so a
          # partial run is resumed by re-running the job.
          for crate in openwarrant-core openwarrant-agent openwarrant-compiler openwarrant-cli; do
            prefix=$(printf '%s' "$crate" | awk '{ l=length($0); if (l==1) print "1"; else if (l==2) print "2"; else if (l==3) print "3/" substr($0,1,1); else print substr($0,1,2) "/" substr($0,3,2) }')
            index_url="https://index.crates.io/$prefix/$crate"
            if curl -fsSL "$index_url" 2>/dev/null | grep -q "\"vers\":\"$version\""; then
              echo "$crate $version is already in the index; skipping"
              continue
            fi
            cargo publish -p "$crate"
            for i in $(seq 1 60); do
              if curl -fsSL "$index_url" 2>/dev/null | grep -q "\"vers\":\"$version\""; then break; fi
              [[ "$i" -lt 60 ]] || { echo "$crate $version did not appear in the index within 10 minutes" >&2; exit 1; }
              sleep 10
            done
          done

  preview:
    name: publish alpha preview
    needs: publish
    if: github.event_name == 'workflow_dispatch' && inputs.preview_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          merge-multiple: true
      - name: Publish only the checked alpha preview
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ inputs.preview_tag }}
        run: |
          set -euo pipefail
          [[ "$PREVIEW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]] || exit 1
          python3 conformance/release/check_preview.py --directory dist --tag "$PREVIEW_TAG" --commit "$GITHUB_SHA"
          # The owner-created draft must exist. Never replace a published version.
          gh release view "$PREVIEW_TAG" --json isDraft,isPrerelease | jq -e '.isDraft == true and .isPrerelease == true'
          # A pre-existing tag could point to different source than these artifacts.
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$PREVIEW_TAG" >/dev/null
          tag_status=$?
          set -e
          [[ "$tag_status" == 2 ]] || { echo "Existing tag or unavailable tag check; refusing publication" >&2; exit 1; }
          gh release upload "$PREVIEW_TAG" dist/*
          gh release edit "$PREVIEW_TAG" --target "$GITHUB_SHA" --draft=false --prerelease --latest=false --notes-file docs/releases/alpha1.md
