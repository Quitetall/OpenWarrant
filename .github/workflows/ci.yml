name: Checkpoint and Bonsai

# Cost discipline is deliberate, not incidental. ADR 0179 measured what the
# alternative costs on this account: an unfiltered four-platform matrix with two
# macOS legs at 10x billing ran roughly $5.52 per push and exhausted a $20 month
# in about three and a half pushes, and one job with no `timeout-minutes`
# inherited GitHub's 360-minute default for ~$288 of exposure from a single hang.
# Every job below therefore declares a timeout, and the workflow declares a
# concurrency group so a rapid push sequence cancels its own superseded runs.
#
# RUNNER TIER (ADR 0182). OpenWarrant is public. Pull requests can originate
# from untrusted forks, so every job runs on GitHub-hosted `ubuntu-latest`.
# Never move pull-request execution onto a workstation-hosted runner: a public
# fork would then execute attacker-supplied code on that workstation.

on:
  workflow_dispatch:
  # Release calls this same checkpoint before packaging, so a release cannot be
  # greener than main and runs the sharded battery, not one 75-minute job.
  workflow_call:
    inputs:
      full:
        description: Run the full checkpoint (always, when called)
        type: boolean
        default: true
  schedule:
    - cron: "27 7 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Prefixed: when Release calls this, github.workflow is "Release", and group
  # names ignore case, so an unprefixed group would be Release's own and cancel it.
  group: checkpoint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The checkpoint, as jobs that run the SAME definition (`cargo xtask gate
  # --only <id>`, in xtask/src/main.rs) on separate runners. `full-gate` is the
  # one stable name a required check or a release can name: it passes only when
  # every job it needs passed. A skipped job is never a full-gate receipt.
  #
  # Required checks are matched BY NAME (see fast.yml). Adding a job here is an
  # edit to this file and to `cargo xtask gate`, not a new branch-protection rule.
  #
  # Each job's timeout is finite and the whole gate's wall time is the longest
  # job, not the sum. The previous single job ran 50-73 minutes against a 75
  # minute cap; the plant battery is now four shards of that work.
  build:
    name: full / build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: `sas.section-current` asks git whether a cited
          # section moved since the pinned SAS revision (OW-WAR-0125 AM-002).
          fetch-depth: 0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-dev
      # The shipped binary, built once. The plants, corpus and attestation
      # jobs download it instead of compiling it again.
      - run: cargo xtask gate --only build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: war-binary
          path: target/debug/war
          retention-days: 1
          if-no-files-found: error

  lint:
    name: full / lint
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-dev
      - name: Install cargo-deny
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-deny
      - name: Schema-validation dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/schema-validation"
          "$RUNNER_TEMP/schema-validation/bin/python" -m pip install 'jsonschema==4.26.0'
          echo "$RUNNER_TEMP/schema-validation/bin" >> "$GITHUB_PATH"
      - run: cargo xtask gate --only format,clippy,licenses,spdx,workflows,skill,doc-tests

  tests:
    name: full / tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-test
      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-nextest
      - name: Schema-validation dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/schema-validation"
          "$RUNNER_TEMP/schema-validation/bin/python" -m pip install 'jsonschema==4.26.0'
          echo "$RUNNER_TEMP/schema-validation/bin" >> "$GITHUB_PATH"
      - run: cargo xtask gate --only tests

  corpus:
    name: full / corpus
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: war-binary
          path: target/debug/
      - run: chmod +x target/debug/war
      - name: Schema-validation dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/schema-validation"
          "$RUNNER_TEMP/schema-validation/bin/python" -m pip install 'jsonschema==4.26.0'
          echo "$RUNNER_TEMP/schema-validation/bin" >> "$GITHUB_PATH"
      - run: cargo xtask gate --only corpus,attest
      # OW-WAR-0134: an acceptance is valid only for the candidate a human
      # accepted. On a pull request HEAD is the merge commit and HEAD^1 the
      # target branch. The locator commits live on the pull request's branch,
      # so this step fetches the history the shallow checkout left out.
      - name: Acceptance still describes the merge candidate
        if: github.event_name == 'pull_request'
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --unshallow origin "$GITHUB_SHA"
          fi
          ./target/debug/war pins --candidate HEAD --base HEAD^1 --resolved-only

  plants:
    name: full / plants ${{ matrix.shard }}/4
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: war-binary
          path: target/debug/
      - run: chmod +x target/debug/war
      - name: Schema-validation dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/schema-validation"
          "$RUNNER_TEMP/schema-validation/bin/python" -m pip install 'jsonschema==4.26.0'
          echo "$RUNNER_TEMP/schema-validation/bin" >> "$GITHUB_PATH"
      # One shard of the §92 battery. Shards partition the plant files (plant.sh).
      - run: cargo xtask gate --only plants
        env:
          OW_PLANT_SHARD: ${{ matrix.shard }}/4
          OW_PLANT_REPORT: ${{ runner.temp }}/shard-${{ matrix.shard }}.report
      # What this shard ran, kept even when it failed. A shard that died part
      # way leaves no complete report, and `plants-total` refuses that.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: plant-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}.report
          retention-days: 7
          if-no-files-found: warn

  # A green matrix proves each shard passed what it ran, not that the shards ran
  # the battery. This reads what they say they ran: every plant file exactly
  # once, every shard accounted for, and the battery's one total.
  plants-total:
    name: full / plants total
    needs: plants
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.full)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: plant-report-*
          path: plant-reports
      - name: Every plant exactly once, and the total
        run: python3 conformance/plant-select.py reports plant-reports --of 4 --weights-out "$RUNNER_TEMP/plant-weights.tsv"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: plant-weights
          path: ${{ runner.temp }}/plant-weights.tsv
          retention-days: 7
          if-no-files-found: warn

  schemas:
    name: full / schemas
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-dev
      - name: Schema-validation dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/schema-validation"
          "$RUNNER_TEMP/schema-validation/bin/python" -m pip install 'jsonschema==4.26.0'
          echo "$RUNNER_TEMP/schema-validation/bin" >> "$GITHUB_PATH"
      - run: cargo xtask gate --only schemas

  # The stable name. Passes only when every job above passed.
  full-gate:
    name: full-gate
    needs: [build, lint, tests, corpus, plants, plants-total, schemas]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.full)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job of the checkpoint passed
        run: |
          test "${{ needs.build.result }}" = success
          test "${{ needs.lint.result }}" = success
          test "${{ needs.tests.result }}" = success
          test "${{ needs.corpus.result }}" = success
          test "${{ needs.plants.result }}" = success
          test "${{ needs.plants-total.result }}" = success
          test "${{ needs.schemas.result }}" = success

  bonsai-report:
    name: bonsai-report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Build the adapter from protected base. The pull-request tree is
          # materialized below as data and is never built or executed here.
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read Warrant from pull request
        id: warrant
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          alias="$(printf '%s\n' "$PR_BODY" | sed -nE 's/^Warrant:[[:space:]]*(OW-WAR-[0-9]{4})[[:space:]]*$/\1/p' | head -n1)"
          printf 'alias=%s\n' "$alias" >> "$GITHUB_OUTPUT"
          if [ -z "$alias" ]; then
            echo "No machine-readable Warrant line; report-phase check skipped."
          fi

      - name: Materialize pull-request candidate as data
        id: candidate
        if: steps.warrant.outputs.alias != ''
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin \
            "refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr-$PR_NUMBER"
          test "$(git rev-parse "origin/pr-$PR_NUMBER")" = "$HEAD"
          candidate="$RUNNER_TEMP/candidate"
          git worktree add --detach "$candidate" "$HEAD"
          printf 'path=%s\n' "$candidate" >> "$GITHUB_OUTPUT"

      - name: Determine whether Bonsai is required
        id: applicability
        if: steps.warrant.outputs.alias != ''
        env:
          WARRANT: ${{ steps.warrant.outputs.alias }}
          CANDIDATE: ${{ steps.candidate.outputs.path }}
        run: |
          if [ -z "$CANDIDATE" ] || [ ! -d "$CANDIDATE/docs/warrants/$WARRANT" ]; then
            echo "Candidate unavailable; applicability is unknown, retaining the report failure."
            echo 'required=true' >> "$GITHUB_OUTPUT"
          elif rg -q '^(bonsai_source|bonsai_revision)[[:space:]]*=' "$CANDIDATE/docs/warrants/$WARRANT/scope.toml" 2>/dev/null || rg -q 'gate://software.repo.bonsai-evidence' "$CANDIDATE/docs/warrants/$WARRANT"; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
            echo 'Bonsai: not applicable. This Warrant declares no Bonsai scope or gate; no evidence or gate pass was minted.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Warrant report tool
        if: steps.applicability.outputs.required == 'true'
        run: cargo build -p openwarrant-cli

      # Bonsai source is public. This PR-triggered job uses no private credential:
      # it clones only the canonical source, verifies the Warrant-pinned commit,
      # and runs its locked build on the hosted ephemeral runner.

      - name: Build Warrant-pinned public Bonsai
        id: bonsai-source
        if: steps.applicability.outputs.required == 'true'
        continue-on-error: true
        env:
          WARRANT: ${{ steps.warrant.outputs.alias }}
          CANDIDATE: ${{ steps.candidate.outputs.path }}
        run: |
          repository="${CANDIDATE:-$GITHUB_WORKSPACE}"
          scope="$repository/docs/warrants/$WARRANT/scope.toml"
          source="$(sed -nE 's/^bonsai_source = "([^"]+)"$/\1/p' "$scope")"
          revision="$(sed -nE 's/^bonsai_revision = "([0-9a-f]{40})"$/\1/p' "$scope")"
          if [ "$source" != "github:Quitetall/bonsai" ] || [ -z "$revision" ]; then
            echo "Scope does not name canonical public Bonsai source and full revision."
            exit 1
          fi
          root="$RUNNER_TEMP/bonsai"
          GIT_TERMINAL_PROMPT=0 git clone --filter=blob:none \
            https://github.com/Quitetall/bonsai.git "$root"
          git -C "$root" checkout --detach "$revision"
          test "$(git -C "$root" rev-parse HEAD)" = "$revision"
          # Cargo discovers config above its working directory. Build from
          # pinned Bonsai, never from the pull-request checkout.
          cd "$root"
          cargo build --locked --release
          printf 'binary=%s\n' "$root/target/release/bonsai" >> "$GITHUB_OUTPUT"

      - name: Emit Warrant-bound Bonsai evidence
        id: bonsai
        if: steps.applicability.outputs.required == 'true'
        env:
          WARRANT: ${{ steps.warrant.outputs.alias }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          CANDIDATE: ${{ steps.candidate.outputs.path }}
          BONSAI_BINARY: ${{ steps.bonsai-source.outputs.binary }}
        run: |
          set +e
          evidence="$RUNNER_TEMP/bonsai-evidence.json"
          bonsai="${BONSAI_BINARY:-$RUNNER_TEMP/bonsai-unavailable}"
          repository="${CANDIDATE:-$GITHUB_WORKSPACE}"
          BASE="$(git -C "$GITHUB_WORKSPACE" merge-base "$HEAD" "$BASE_SHA")"
          cd "$repository"
          "$GITHUB_WORKSPACE/target/debug/war" bonsai check \
            --warrant "$WARRANT" \
            --base "$BASE" \
            --head "$HEAD" \
            --bonsai "$bonsai" \
            > "$evidence"
          status=$?
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          if ! jq -e '.schema == "oh.war/bonsai-evidence/v1"' "$evidence" > /dev/null; then
            echo "Adapter emitted no valid evidence document; report artifact withheld."
            exit 1
          fi
          # `war bonsai check` requires a clean worktree. Keep its output out
          # of the checkout until the check has completed, then publish it.
          cp "$evidence" "$GITHUB_WORKSPACE/bonsai-evidence.json"
          if jq -e '.schema == "oh.war/bonsai-evidence/v1" and .verdict == "pass"' "$GITHUB_WORKSPACE/bonsai-evidence.json" > /dev/null; then
            contract="$(jq -r '.warrant.contract_digest' "$GITHUB_WORKSPACE/bonsai-evidence.json")"
            digest="$(sha256sum "$GITHUB_WORKSPACE/bonsai-evidence.json" | awk '{print $1}')"
            cd "$GITHUB_WORKSPACE"
            ./target/debug/war gate --run --record --gate software.repo.bonsai-evidence \
              --subject-digest "contract:sha256:$contract" \
              --evidence-ref "file:bonsai-evidence.json#sha256:$digest" || true
          else
            echo "Adapter emitted no valid evidence document; no receipt binding minted."
          fi
          echo "Report phase: evidence status is recorded, not merge-blocking."
          exit 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.applicability.outputs.required == 'true'
        with:
          name: bonsai-evidence-${{ github.event.pull_request.number }}
          path: |
            bonsai-evidence.json
            docs/receipts/*.receipt.json
            docs/receipts/*.stdout.txt
            docs/receipts/*.stderr.txt
          if-no-files-found: error
