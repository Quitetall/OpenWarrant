version: 2

# Weekly, not daily. This repository is public, but daily updates across a graph
# of ~70 crates still create review noise. Grouped updates keep maintenance work
# bounded while every bump remains subject to the full gate.
#
# Every bump still has to clear the full gate, including `cargo deny check
# licenses` — so a dependency update that would close off the Apache-2.0
# relicense fails automatically rather than in review.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
