<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">OpenWarrant target architecture</title>
  <desc id="desc">OpenWarrant owns the standard and SDK. LAMU and other compilers build context. Workflow applications run work, track progress and collect review. These are planned ownership boundaries.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#79756b" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="340" rx="20" fill="#f6f4ee"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="38" y="44" font-size="12" font-weight="700" letter-spacing="2" fill="#79756b">TARGET ARCHITECTURE</text>
    <text x="38" y="81" font-size="26" fill="#20262b">One standard. Tools with clear responsibilities.</text>
    <g fill="#fffefa" stroke="#d6d2c8">
      <rect x="38" y="113" width="336" height="160" rx="12"/>
      <rect x="432" y="113" width="336" height="160" rx="12"/>
      <rect x="826" y="113" width="336" height="160" rx="12"/>
    </g>
    <g fill="none" stroke="#79756b" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M382 191H421"/><path d="M776 191H815"/>
    </g>
    <g font-size="11" font-weight="700" letter-spacing="1.6" fill="#79756b">
      <text x="62" y="144">01 / STANDARD + SDK</text>
      <text x="456" y="144">02 / CONTEXT COMPILERS</text>
      <text x="850" y="144">03 / WORKFLOW APPLICATIONS</text>
    </g>
    <g font-size="23" font-weight="700" fill="#20262b">
      <text x="62" y="184">OpenWarrant</text>
      <text x="456" y="184">LAMU + other providers</text>
      <text x="850" y="184">Your tools and agents</text>
    </g>
    <g font-size="16" fill="#555a5b">
      <text x="62" y="219">Author, parse and validate documents.</text>
      <text x="62" y="243">Share typed records and contracts.</text>
      <text x="456" y="219">Resolve sources and build context.</text>
      <text x="456" y="243">Produce precise task projections.</text>
      <text x="850" y="219">Execute, track and report work.</text>
      <text x="850" y="243">Handle questions and review.</text>
    </g>
    <text x="38" y="308" font-size="13" fill="#79756b">The SDK runs on its own. Compiler and application integrations use the same document standard.</text>
  </g>
</svg>
