# SPDX-License-Identifier: Apache-2.0
# A built-in profile of OpenWarrant Format 1.0 (docs/format/FORMAT-1.0.md
# section 7.6), as profile data (section 7.5). Normative: this file is the
# profile; where it and the prose disagree, the prose wins and this file is
# the defect.
schema = "oh.war/profile/v1"
format = "openwarrant/1.0"
name = "spec"
form = "document"
note = "A repository's specification: SPEC.md and its parts spec/<area>.md (section 4.5)."
capabilities = ["structure", "links", "acceptance"]

# Section 4.5: `version` is REQUIRED on SPEC.md, and a part needs none;
# Purpose and Scope are required on SPEC.md, and parts require none. One
# profile governs the root and its parts, so those are core rules of 4.5.
[frontmatter]
required = []
optional = ["version"]

[sections]
required = []
optional = ["Purpose", "Scope", "Glossary", "Context"]

[records]
types = ["requirement", "constraint", "outcome", "decision", "option", "consequence", "interface", "term"]

[fields.requirement]
statement = { required = true, shape = "text" }
rationale = { required = false, shape = "text" }
verify = { required = false, shape = "text" }
priority = { required = false, shape = "enum", values = ["must", "should", "may"] }

[fields.constraint]
statement = { required = true, shape = "text" }
rationale = { required = false, shape = "text" }
verify = { required = false, shape = "text" }
priority = { required = false, shape = "enum", values = ["must", "should", "may"] }

[relations]
allow = ["part_of", "depends_on", "implements", "constrains", "evaluates", "supersedes", "supports", "refutes", "trades_off_against", "causes", "qualifies", "selected_over"]
