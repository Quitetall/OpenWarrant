# SPDX-License-Identifier: Apache-2.0
# A built-in profile of OpenWarrant Format 1.0 (docs/format/FORMAT-1.0.md
# section 7.6), as profile data (section 7.5). Normative: this file is the
# profile; where it and the prose disagree, the prose wins and this file is
# the defect.
schema = "oh.war/profile/v1"
format = "openwarrant/1.0"
name = "roadmap"
form = "document"
note = "A roadmap: phases as `phase` records."
capabilities = ["structure", "links", "claims"]

[records]
types = ["phase"]

[relations]
allow = ["part_of", "depends_on", "implements", "constrains", "evaluates", "supersedes", "supports", "refutes", "trades_off_against", "causes", "qualifies", "selected_over"]
