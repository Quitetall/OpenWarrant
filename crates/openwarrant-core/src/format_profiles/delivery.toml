# SPDX-License-Identifier: Apache-2.0
# A built-in profile of OpenWarrant Format 1.0 (docs/format/FORMAT-1.0.md
# section 7.6), as profile data (section 7.5). Normative: this file is the
# profile; where it and the prose disagree, the prose wins and this file is
# the defect.
schema = "oh.war/profile/v1"
format = "openwarrant/1.0"
name = "delivery"
form = "work"
note = "A unit of delivery work: intent, basis, work order and the obligations that check it."
capabilities = ["structure", "links", "claims", "checks", "stages", "acceptance", "evidence", "verification", "authorization", "resolution"]

[frontmatter]
required = []
optional = ["assurance_level"]

# Section 4.1: delivery also requires at least one obligation, which profile
# data has no key for; the core states it.
[sections]
required = ["Intent", "Basis", "Work order", "Assurance"]
optional = ["Milestones"]

[records]
types = ["obligation", "milestone", "stage", "check", "kpi"]

[fields.obligation]
scope = { required = true, shape = "text" }
evidence = { required = true, shape = "text" }
refusal = { required = false, shape = "text" }
gate = { required = false, shape = "gate" }
scope_kind = { required = false, shape = "enum", values = ["single_instance", "enumerated_set", "bounded_domain", "bounded_corpus", "sampled_population", "temporal_window", "existential", "universal", "formal_model"] }
criticality = { required = false, shape = "enum", values = ["required", "advisory"] }

[fields.stage]
executor = { required = false, shape = "line" }
tier = { required = false, shape = "enum", values = ["T0", "T1", "T2", "T3"] }
budget_tokens = { required = false, shape = "int" }
context = { required = false, shape = "ids" }

[fields.check]
run = { required = true, shape = "line" }
on = { required = false, shape = "line" }
timeout = { required = false, shape = "int" }
gating = { required = false, shape = "enum", values = ["true", "false"] }

[fields.kpi]
run = { required = true, shape = "line" }
on = { required = false, shape = "line" }
timeout = { required = false, shape = "int" }
gating = { required = false, shape = "enum", values = ["true", "false"] }
direction = { required = true, shape = "enum", values = ["min", "max"] }
target = { required = false, shape = "number" }
mode = { required = false, shape = "enum", values = ["threshold", "best", "optimise"] }

[relations]
allow = ["part_of", "depends_on", "implements", "constrains", "evaluates", "supersedes", "supports", "refutes", "trades_off_against", "causes", "qualifies", "selected_over"]

[ticks]
item = "claimed"
milestone = "claimed"
