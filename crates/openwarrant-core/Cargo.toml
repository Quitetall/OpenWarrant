[package]
name = "openwarrant-core"
description = "Pure domain types and validators for Work Authorization Records (WAR)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# SAS §79.1: "Avoid I/O where practical." This crate defines and validates
# meaning; reading and writing files is the CLI's job and compiling is the
# compiler's. Keeping `std::fs` out of here is what makes the validators
# testable against in-memory fixtures rather than against a scratch directory.
[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
# RC.3 names TOML 1.0; workspace toml accepts the newer 1.1 grammar.
toml10 = { package = "toml", version = "=0.8.23", default-features = false, features = ["parse"] }
uuid = { workspace = true }
# Optional, behind `schema`: the JSON Schema pack (OW-WAR-0032) is generated
# from these types by `war schemas`; document parsing additionally uses toml10.
schemars = { workspace = true, optional = true }

# Schema generation remains optional. The document SDK additionally uses the
# explicitly pinned TOML 1.0 parser above; legacy parsing semantics are unchanged.
[features]
schema = ["dep:schemars"]

[dev-dependencies]
serde_jcs = { workspace = true }
serde_json = { workspace = true }
