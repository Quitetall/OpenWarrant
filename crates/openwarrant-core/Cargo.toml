[package]
name = "openwarrant-core"
description = "Pure domain types and validators for Work Authorization Records (WAR)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# SAS §79.1: "Avoid I/O where practical." This crate defines and validates
# meaning; reading and writing files is the CLI's job and compiling is the
# compiler's. Keeping `std::fs` out of here is what makes the validators
# testable against in-memory fixtures rather than against a scratch directory.
[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
# Optional, behind `schema`: the JSON Schema pack (OW-WAR-0032) is generated
# from these types by `war schemas`; the default surface stays serde, thiserror, uuid.
schemars = { workspace = true, optional = true }

# Test-only. This crate's production dependency surface is deliberately serde,
# thiserror, uuid and nothing else; a round-trip test must not widen it.
[features]
schema = ["dep:schemars"]

[dev-dependencies]
serde_jcs = { workspace = true }
serde_json = { workspace = true }
