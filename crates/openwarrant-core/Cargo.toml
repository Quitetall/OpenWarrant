[package]
name = "openwarrant-core"
description = "Pure domain types and validators for Work Authorization Records (WAR)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# SAS §79.1: "Avoid I/O where practical." This crate defines and validates
# meaning; reading and writing files is the CLI's job and compiling is the
# compiler's. Keeping `std::fs` out of here is what makes the validators
# testable against in-memory fixtures rather than against a scratch directory.
[dependencies]
jstrict = { workspace = true }
serde = { workspace = true }
# Extension fields are JSON protocol data. `jstrict` supplies the mandatory
# first admission phase: a lossless AST which preserves duplicate keys and
# lexical numbers while keeping real objects distinct from Serde transports.
# Accepted numbers are normalized through the workspace RFC 8785
# implementation; values whose mathematical meaning would change fail closed.
serde_jcs = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
