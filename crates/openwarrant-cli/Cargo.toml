[package]
name = "openwarrant-cli"
description = "The `war` command line interface for Work Authorization Records."
version = "1.0.0-alpha.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "openwarrant_cli"
path = "src/lib.rs"
# A lib target runs doctests; a bin target does not. Turning this crate into a
# library would start doctesting ~40k lines of doc comments that were never
# written as doctests, in one step. Off deliberately, reversible on its own.
doctest = false

[[bin]]
name = "war"
path = "src/main.rs"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
sha2 = { workspace = true }
serde_jcs = { workspace = true }
rmcp = { workspace = true }
tokio = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Removed in 811e0f3 as an unused dependency and restored here for its first
# real use: `war compile` lowers and renders. OW-WAR-0004 predicted exactly this,
# which is why the removal was correct at the time rather than churn.
openwarrant-compiler = { path = "../openwarrant-compiler", version = "1.0.0" }
openwarrant-core = { path = "../openwarrant-core", version = "1.0.0" }
camino = { workspace = true }
ureq = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }

[features]
# `war schemas`: the JSON Schema pack, generated from the record types.
# Off in the shipped binary; `cargo xtask gate` builds it on.
schema = ["openwarrant-core/schema", "openwarrant-compiler/schema"]

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"] }
